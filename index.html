<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 ГеоМастер — интерактивная карта мира</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  
  :root {
    --bg-primary: #070b16;
    --bg-gradient-1: rgba(139,92,246,.16);
    --bg-gradient-2: rgba(6,182,212,.12);
    --text-primary: #eef1ff;
    --text-secondary: rgba(238,241,255,.8);
    --text-dim: rgba(238,241,255,.55);
    --panel-bg: rgba(11,16,32,.72);
    --panel-border: rgba(255,255,255,.09);
    --btn-bg: rgba(255,255,255,.06);
    --btn-border: rgba(255,255,255,.1);
    --btn-hover: rgba(255,255,255,.12);
    --accent-1: #8b5cf6;
    --accent-2: #06b6d4;
    --ocean-1: #1a4d6e;
    --ocean-2: #0f2d47;
    --land-known: #5a8f6a;
    --land-unknown: #4a6b5a;
    --land-border: #2d4a3a;
    --land-highlight: #10b981;
    --land-highlight-stroke: #34d399;
    --overlay-bg: rgba(0,0,0,.6);
  }
  
  [data-theme="light"] {
    --bg-primary: #f0f4f8;
    --bg-gradient-1: rgba(139,92,246,.08);
    --bg-gradient-2: rgba(6,182,212,.06);
    --text-primary: #1a202c;
    --text-secondary: rgba(26,32,44,.8);
    --text-dim: rgba(26,32,44,.55);
    --panel-bg: rgba(255,255,255,.85);
    --panel-border: rgba(0,0,0,.08);
    --btn-bg: rgba(0,0,0,.04);
    --btn-border: rgba(0,0,0,.1);
    --btn-hover: rgba(0,0,0,.08);
    --accent-1: #8b5cf6;
    --accent-2: #06b6d4;
    --ocean-1: #4a90e2;
    --ocean-2: #357abd;
    --land-known: #8bc34a;
    --land-unknown: #a5d6a7;
    --land-border: #689f38;
    --land-highlight: #ff9800;
    --land-highlight-stroke: #ffb74d;
    --overlay-bg: rgba(0,0,0,.4);
  }
  
  body {
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(1200px 800px at 80% -10%, var(--bg-gradient-1), transparent 60%),
      radial-gradient(1000px 700px at 10% 110%, var(--bg-gradient-2), transparent 60%),
      var(--bg-primary);
    touch-action: none;
    transition: background .3s ease;
  }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #viewport path { vector-effect: non-scaling-stroke; }
  #countries path { cursor: pointer; transition: filter .15s; }
  #countries path:hover { filter: brightness(1.2); }
  .flash-correct { fill: #10b981 !important; }
  .flash-wrong { fill: #f43f5e !important; }

  .hud { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .logo {
    font-size: 19px; font-weight: 800; letter-spacing: .3px;
    background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border); padding: 10px 18px; border-radius: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .logo .grad {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--panel-border);
    background: var(--btn-bg); cursor: pointer; font-size: 18px; transition: .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  
  .modes { display: flex; gap: 8px; }
  .mode-btn {
    padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--panel-bg); backdrop-filter: blur(14px); color: var(--text-secondary);
  }
  .mode-btn:hover { color: var(--text-primary); background: var(--btn-hover); }
  .mode-btn.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 6px 20px rgba(139,92,246,.4);
  }
  .views {
    display: flex; padding: 3px; border-radius: 12px;
    background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
  }
  .view-btn {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer; transition: .2s;
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 9px;
  }
  .view-btn:hover { color: var(--text-primary); }
  .view-btn.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff;
    box-shadow: 0 4px 14px rgba(139,92,246,.4);
  }

  .panel {
    position: fixed; top: 16px; right: 16px; width: 344px; z-index: 10;
    background: var(--panel-bg); backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--panel-border); border-radius: 22px; padding: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    max-height: calc(100vh - 32px); overflow-y: auto;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 99px; }
  .panel h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .panel p { line-height: 1.55; margin-bottom: 10px; font-size: 15px; }
  .dim { opacity: .55; font-size: 13.5px; }
  .en-name { opacity: .5; font-size: 13px; }
  .capital { font-size: 17px; margin-top: 4px; }

  .fade { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; opacity: .5; margin: 16px 0 8px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--btn-bg); color: var(--text-secondary);
  }
  .chip:hover { background: var(--btn-hover); }
  .chip.active {
    background: linear-gradient(135deg, rgba(139,92,246,.9), rgba(6,182,212,.9));
    border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(139,92,246,.35);
  }
  .chip-count { font-size: 11px; opacity: .75; background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 999px; }
  .record-line {
    font-size: 14px; margin: 18px 0 16px; padding: 11px 14px;
    background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 14px;
  }

  .quiz-top { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--btn-bg); border: 1px solid var(--btn-border); }
  .score-pill { background: rgba(250,204,21,.12); border-color: rgba(250,204,21,.25); }
  .timer { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .timer-track { flex: 1; height: 8px; border-radius: 999px; background: var(--btn-bg); overflow: hidden; }
  .timer-bar { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width .1s linear; }
  .timer-bar.low { background: linear-gradient(90deg, #f43f5e, #fb923c); }
  #timer-num { font-weight: 800; min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }

  .q-title { font-size: 17px; font-weight: 600; opacity: .85; margin-bottom: 4px; }
  .q-target {
    font-size: 30px; font-weight: 800; margin: 6px 0 14px; line-height: 1.25;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .flag-wrap img { width: 100%; max-width: 250px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5); margin: 6px 0 14px; }
  .card-flag img { max-width: none; margin-top: 0; }
  .q-emoji { font-size: 64px; margin: 6px 0 14px; }
  #q-feedback { min-height: 22px; font-weight: 700; font-size: 15px; margin: 8px 0 4px; }
  #q-feedback.good { color: #34d399; }
  #q-feedback.bad { color: #fb7185; }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    padding: 11px 20px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--btn-bg); color: var(--text-primary);
  }
  .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border: none; box-shadow: 0 8px 24px rgba(139,92,246,.35); color: #fff; }
  .btn.primary:hover { filter: brightness(1.12); box-shadow: 0 10px 28px rgba(139,92,246,.45); }
  .btn.big { width: 100%; padding: 14px; font-size: 16px; }
  .btn.ghost { background: transparent; border-color: transparent; opacity: .7; }
  .btn.ghost:hover { opacity: 1; background: var(--btn-hover); }

  .center { text-align: center; }
  .big-score {
    font-size: 58px; font-weight: 800; margin: 12px 0 4px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .big-total { font-size: 30px; }
  .new-record {
    display: inline-block; padding: 8px 18px; border-radius: 999px; font-weight: 800; margin: 8px 0;
    background: linear-gradient(135deg, rgba(250,204,21,.16), rgba(251,146,60,.16));
    border: 1px solid rgba(250,204,21,.4); color: #fde68a;
    animation: pulse 1.3s ease infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  .zoom-controls { position: fixed; bottom: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
  .zoom-controls button {
    width: 44px; height: 44px; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; transition: .2s;
    border: 1px solid var(--btn-border); background: var(--panel-bg);
    backdrop-filter: blur(14px); color: var(--text-primary);
  }
  .zoom-controls button:hover { background: var(--btn-hover); }

  #tooltip {
    position: fixed; display: none; z-index: 30; pointer-events: none; white-space: nowrap;
    background: var(--panel-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); color: var(--text-primary);
    padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
  }

  .panel-handle {
    display: none;
    width: 100%; padding: 10px 0 6px; cursor: pointer;
    text-align: center; user-select: none;
  }
  .panel-handle-bar {
    width: 42px; height: 5px; border-radius: 999px;
    background: rgba(255,255,255,.25); margin: 0 auto 8px;
  }
  .panel-handle-title {
    font-size: 14px; font-weight: 700; opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 80%; margin: 0 auto;
  }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--overlay-bg); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel-bg); backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--panel-border); border-radius: 22px; padding: 26px;
    max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.95) translateY(10px); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-overlay.show .modal { transform: scale(1) translateY(0); }
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 99px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { font-size: 24px; margin: 0; }
  .close-btn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--btn-border);
    background: var(--btn-bg); cursor: pointer; font-size: 18px; color: var(--text-primary);
    display: flex; align-items: center; justify-content: center; transition: .2s;
  }
  .close-btn:hover { background: var(--btn-hover); }

  .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .ach-card {
    padding: 14px 10px; border-radius: 14px; text-align: center;
    background: var(--btn-bg); border: 1px solid var(--btn-border);
    transition: .2s; position: relative;
  }
  .ach-card.unlocked {
    background: linear-gradient(135deg, rgba(139,92,246,.15), rgba(6,182,212,.15));
    border-color: rgba(139,92,246,.3);
    box-shadow: 0 4px 14px rgba(139,92,246,.2);
  }
  .ach-card.locked { opacity: .5; filter: grayscale(.7); }
  .ach-icon { font-size: 32px; margin-bottom: 6px; }
  .ach-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .ach-desc { font-size: 11px; opacity: .7; line-height: 1.3; }
  .ach-lock { position: absolute; top: 6px; right: 6px; font-size: 12px; opacity: .6; }

  .stats-summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .stat-box {
    padding: 12px 8px; border-radius: 12px; text-align: center;
    background: var(--btn-bg); border: 1px solid var(--btn-border);
  }
  .stat-value { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat-label { font-size: 11px; opacity: .6; margin-top: 2px; }
  .weak-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
  .weak-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: var(--btn-bg); border: 1px solid var(--btn-border);
  }
  .weak-flag { font-size: 22px; }
  .weak-info { flex: 1; min-width: 0; }
  .weak-name { font-size: 14px; font-weight: 700; }
  .weak-bar { height: 4px; border-radius: 99px; background: var(--btn-border); margin-top: 4px; overflow: hidden; }
  .weak-fill { height: 100%; background: linear-gradient(90deg, #f43f5e, #fb923c); border-radius: 99px; transition: width .3s; }
  .weak-pct { font-size: 12px; font-weight: 700; opacity: .7; min-width: 40px; text-align: right; }
  .empty-state { text-align: center; padding: 30px 10px; opacity: .6; }
  .empty-state .big-emoji { font-size: 48px; margin-bottom: 10px; }

  .toast-container {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none; width: 90%; max-width: 360px;
  }
  .toast {
    background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(6,182,212,.95));
    color: #fff; padding: 14px 18px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(139,92,246,.5);
    display: flex; align-items: center; gap: 12px;
    animation: toastIn .4s cubic-bezier(.2,.8,.2,1) both;
    pointer-events: auto;
  }
  .toast.out { animation: toastOut .3s ease both; }
  .toast-icon { font-size: 28px; }
  .toast-text { flex: 1; }
  .toast-title { font-size: 14px; font-weight: 800; }
  .toast-desc { font-size: 12px; opacity: .9; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px) scale(.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-20px) scale(.9); }
  }

  @media (max-width: 700px) {
    .hud { top: 10px; left: 10px; gap: 8px; }
    .logo { font-size: 15px; padding: 8px 14px; }
    .icon-btn { width: 32px; height: 32px; font-size: 16px; }
    .mode-btn { padding: 10px 14px; font-size: 14px; }
    .view-btn { padding: 8px 12px; font-size: 13px; }
    .zoom-controls { bottom: auto; top: 42%; right: 10px; }
    .zoom-controls button { width: 44px; height: 44px; font-size: 20px; }
    .q-target { font-size: 26px; }

    .panel {
      top: auto; bottom: 0; left: 0; right: 0; width: 100%;
      max-height: 75vh; padding: 0 18px 18px;
      border-radius: 22px 22px 0 0;
      transform: translateY(calc(100% - 60px));
    }
    .panel.expanded { transform: translateY(0); }
    .panel-handle { display: block; }
    .panel-content { opacity: 0; pointer-events: none; transition: opacity .2s .1s; }
    .panel.expanded .panel-content { opacity: 1; pointer-events: auto; }
    .panel h2 { font-size: 20px; }
    .panel p { font-size: 15px; }
    .chip { padding: 10px 14px; font-size: 14px; }
    .btn { padding: 12px 18px; font-size: 15px; }
    .big-score { font-size: 50px; }
    
    .modal { padding: 20px; }
    .achievements-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .stats-summary { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-value { font-size: 18px; }
  }
</style>
</head>
<body>

<svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0" class="ocean-stop-1"/>
      <stop offset="1" class="ocean-stop-2"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g id="viewport"></g>
</svg>

<div class="hud">
  <div class="logo">
    🌍 Гео<span class="grad">Мастер</span>
    <button class="icon-btn" id="sound-toggle" onclick="toggleSound()" title="Звук">🔊</button>
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
  </div>
  <div class="modes">
    <button id="btn-explore" class="mode-btn active" onclick="setMode('explore')">🧭 Исследование</button>
    <button id="btn-quiz" class="mode-btn" onclick="setMode('setup')">🎯 Викторина</button>
  </div>
  <div class="views">
    <button id="view-flat" class="view-btn active" onclick="setMapMode('flat')">🗺️ Плоская</button>
    <button id="view-globe" class="view-btn" onclick="setMapMode('globe')">🌐 Глобус</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-handle" id="panel-handle">
    <div class="panel-handle-bar"></div>
    <div class="panel-handle-title" id="panel-handle-title">🧭 Исследование</div>
  </div>
  <div class="panel-content" id="panel-content"><h2>⏳ Загружаем карту мира…</h2></div>
</div>

<div class="zoom-controls">
  <button onclick="zoomBy(1.6)" title="Приблизить">+</button>
  <button onclick="zoomBy(1/1.6)" title="Отдалить">−</button>
  <button onclick="resetZoom()" title="Весь мир">⌂</button>
</div>

<div id="tooltip"></div>

<div class="modal-overlay" id="modal-achievements" onclick="if(event.target===this)closeModal('achievements')">
  <div class="modal">
    <div class="modal-header">
      <h2>🏆 Ачивки</h2>
      <button class="close-btn" onclick="closeModal('achievements')">✕</button>
    </div>
    <div id="achievements-content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-stats" onclick="if(event.target===this)closeModal('stats')">
  <div class="modal">
    <div class="modal-header">
      <h2>📊 Моя статистика</h2>
      <button class="close-btn" onclick="closeModal('stats')">✕</button>
    </div>
    <div id="stats-content"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const W = 960, H = 500;
const QUESTION_TIME = 15;
const GLOBE_ROT0 = [-10, -20, 0];

const LEVELS = {
  world:   { name: 'Весь мир',  icon: '🌍' },
  europe:  { name: 'Европа',    icon: '🏰' },

function trackCorrect(key) {
  stats.countryCorrect[key] = (stats.countryCorrect[key] || 0) + 1;
  saveStats();
}
function trackError(key) {
  stats.countryErrors[key] = (stats.countryErrors[key] || 0) + 1;
  saveStats();
}
function trackExplore(key) {
  if (!stats.exploredCountries.includes(key)) {
    stats.exploredCountries.push(key);
    saveStats();
    checkAchievements();
  }
}
function trackGameEnd(score, total, level, blitz) {
  stats.gamesPlayed++;
  if (score === total) {
    stats.perfectGames++;
    if (blitz) stats.blitzPerfect++;
    if (level !== 'world') {
      stats.continentsPerfected = stats.continentsPerfected || {};
      stats.continentsPerfected[level] = true;
    }
  }
  saveStats();
  checkAchievements();
}

function getWeakCountries(limit = 10) {
  const items = [];
  for (const key of Object.keys(stats.countryErrors)) {
    const errors = stats.countryErrors[key];
    const correct = stats.countryCorrect[key] || 0;
    const total = errors + correct;
    if (total > 0 && errors > 0) {
      items.push({ key, errors, correct, total, pct: errors / total });
    }
  }
  items.sort((a, b) => b.pct - a.pct || b.errors - a.errors);
  return items.slice(0, limit);
}

let audioCtx = null;
let soundEnabled = load(LS.sound, true);

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', volume = 0.1, delay = 0) {
  if (!soundEnabled || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

function playCorrect() {
  playTone(523.25, 0.12, 'sine', 0.08, 0);

function updateOceanColors() {
  const s = getComputedStyle(document.documentElement);
  document.querySelector('.ocean-stop-1').setAttribute('stop-color', s.getPropertyValue('--ocean-1').trim());
  document.querySelector('.ocean-stop-2').setAttribute('stop-color', s.getPropertyValue('--ocean-2').trim());
}
function updateLandColors() {
  if (!paths) return;
  const s = getComputedStyle(document.documentElement);
  const known = s.getPropertyValue('--land-known').trim();
  const unknown = s.getPropertyValue('--land-unknown').trim();
  const border = s.getPropertyValue('--land-border').trim();
  const highlight = s.getPropertyValue('--land-highlight').trim();
  const highlightStroke = s.getPropertyValue('--land-highlight-stroke').trim();
  
  paths.each(function(d) {
    const el = d3.select(this);
    if (d.__highlighted) {
      el.attr('fill', highlight)
        .attr('stroke', highlightStroke)
        .attr('stroke-width', 2)
        .attr('filter', 'url(#glow)');
    } else {
      el.attr('fill', DB[featureKey(d)] ? known : unknown)
        .attr('stroke', border)
        .attr('stroke-width', 0.6)
        .attr('filter', null);
    }
  });
}

function showToast(icon, title, desc, duration = 3500) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-text"><div class="toast-title">${title}</div><div class="toast-desc">${desc}</div></div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function checkAchievements() {
  let newUnlocked = [];
  for (const ach of ACHIEVEMENTS) {
    if (!unlockedAchievements.has(ach.id) && ach.check(stats, unlockedAchievements)) {
      unlockedAchievements.add(ach.id);
      newUnlocked.push(ach);
    }
  }
  if (newUnlocked.length > 0) {
    saveAchievements();
    newUnlocked.forEach((ach, i) => {
      setTimeout(() => {
        playAchievement();
        showToast(ach.icon, `Ачивка: ${ach.name}`, ach.desc, 3500);
      }, i * 800);
    });
  }
}

function renderStats() {
  const totalAnswers = Object.values(stats.countryCorrect).reduce((a,b)=>a+b,0) + Object.values(stats.countryErrors).reduce((a,b)=>a+b,0);
  const totalErrors = Object.values(stats.countryErrors).reduce((a,b)=>a+b,0);
  const accuracy = totalAnswers > 0 ? Math.round((totalAnswers - totalErrors) / totalAnswers * 100) : 0;
  
  const weak = getWeakCountries(8);
  const weakHtml = weak.length === 0
    ? `<div class="empty-state"><div class="big-emoji">🎉</div><p>Пока нет ошибок — ты молодец!<br>Сыграй в викторину, чтобы увидеть слабые места.</p></div>`
    : `<div class="weak-list">${weak.map(w => {
        const c = DB[w.key];
        if (!c) return '';
        return `<div class="weak-item">
          <div class="weak-flag">${flagEmoji(c.flag)}</div>
          <div class="weak-info">
            <div class="weak-name">${c.name}</div>
            <div class="weak-bar"><div class="weak-fill" style="width:${w.pct*100}%"></div></div>
          </div>
          <div class="weak-pct">${w.errors}/${w.total}</div>
        </div>`;
      }).join('')}</div>`;

  const html = `
    <div class="stats-summary">
      <div class="stat-box"><div class="stat-value">${stats.gamesPlayed}</div><div class="stat-label">Игр сыграно</div></div>
      <div class="stat-box"><div class="stat-value">${accuracy}%</div><div class="stat-label">Точность</div></div>
      <div class="stat-box"><div class="stat-value">${stats.exploredCountries.length}</div><div class="stat-label">Стран изучено</div></div>
    </div>
    <div class="section-label">Слабые места</div>
    ${weakHtml}
    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="closeModal('stats');trainWeak()">🎯 Тренировать слабые</button>
      <button class="btn ghost" onclick="resetStats()">Сбросить</button>
    </div>`;
  document.getElementById('stats-content').innerHTML = html;
}

function resetStats() {
  if (!confirm('Сбросить всю статистику и ачивки? Это действие нельзя отменить.')) return;
  stats = defaultStats();
  unlockedAchievements = new Set();
  saveStats();
  saveAchievements();
  renderStats();
  showToast('🗑️', 'Статистика сброшена', 'Начни с чистого листа', 2500);
}

function trainWeak() {
  const weak = getWeakCountries(10);
  if (weak.length === 0) {
    showToast('✨', 'Нет слабых стран', 'Сыграй обычную викторину', 2500);
    return;
  }
  selectedLevel = 'world';
  selectedBlitz = false;
  mode = 'quiz';
  const pool = shuffle(weak.map(w => w.key));
  quiz = {
    level: 'world', blitz: false, isTraining: true,
    questions: pool.slice(0, 10).map(k => ({ id: k, type: randType() })),
    current: 0, score: 0, answered: false
  };
  document.getElementById('btn-explore').classList.remove('active');
  document.getElementById('btn-quiz').classList.add('active');
  renderQuizQuestion();
  collapsePanel();
  showToast('🎯', 'Тренировка', `Слабые страны: ${pool.slice(0,5).map(k=>DB[k].name).join(', ')}...`, 3500);
}

let ready = false;
let mode = 'explore';
let mapMode = 'flat';
let quiz = null;
let selectedLevel = 'world';
let selectedBlitz = false;
let featureByKey = {};
let paths = null, svg, viewport, zoom, projection, path;
let spherePath, graticulePath, haloPath;
let globeScaleDefault = 220, globeDrag;
let timerId = null, timeLeft = 0, advanceTimer = null;
let highlightedFeature = null;

const tooltip = document.getElementById('tooltip');
const panel = document.getElementById('panel');
const panelContent = document.getElementById('panel-content');
const panelHandle = document.getElementById('panel-handle');
const panelHandleTitle = document.getElementById('panel-handle-title');

function isMobile() { return window.innerWidth <= 700; }
function featureKey(f) {
  const id = String(f.id ?? '');
  if (!id) return null;
  if (id.startsWith('-')) return NAME_KEYS[f.properties && f.properties.name] || null;
  return id.padStart(3, '0');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function flagEmoji(code) {
  return code.toUpperCase().replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
}
function flagImg(code, cls = 'flag-wrap') {
  return `<div class="${cls}"><img src="https://flagcdn.com/w320/${code}.png" alt="флаг"
    onerror="this.outerHTML='<div class=q-emoji>${flagEmoji(code)}</div>'"></div>`;
}
function loadRecords() { return load(LS.records, {}); }
function saveRecords(r) { save(LS.records, r); }
function recordKey() { return quiz.level + (quiz.blitz ? '-blitz' : '-classic'); }
function poolFor(level) {
  return Object.keys(DB).filter(k => featureByKey[k] && (level === 'world' || DB[k].level === level));
}

function setHandleTitle(text) { if (panelHandleTitle) panelHandleTitle.textContent = text; }
function togglePanel() { playClick(); panel.classList.toggle('expanded'); }
function collapsePanel() { if (isMobile()) panel.classList.remove('expanded'); }

let touchStartY = 0, touchCurrentY = 0, isSwiping = false;
panelHandle.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY; touchCurrentY = touchStartY; isSwiping = false;
}, { passive: true });
panelHandle.addEventListener('touchmove', (e) => {
  touchCurrentY = e.touches[0].clientY;
  const dy = touchCurrentY - touchStartY;
  if (dy > 10) { isSwiping = true; panel.style.transform = `translateY(${dy}px)`; }
}, { passive: true });
panelHandle.addEventListener('touchend', () => {
  const dy = touchCurrentY - touchStartY;
  if (isSwiping && dy > 80) panel.classList.remove('expanded');
  panel.style.transform = '';
  touchStartY = 0; touchCurrentY = 0; isSwiping = false;
});
panelHandle.addEventListener('click', togglePanel);

init();

async function init() {
  applyTheme(loadTheme());
  updateSoundButton();
  
  let world;
  try {
    world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  } catch (e) {
    panelContent.innerHTML = '<h2>😢 Не удалось загрузить карту</h2><p>Проверь интернет и обнови страницу.</p>';
    return;
  }
  const countries = topojson.feature(world, world.objects.countries);
  countries.features.forEach(f => { const k = featureKey(f); if (k) featureByKey[k] = f; });

  svg = d3.select('#map');
  viewport = d3.select('#viewport');
  projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [W - 10, H - 10]], { type: 'Sphere' });
  path = d3.geoPath(projection);

  haloPath = viewport.append('path')
    .attr('fill', 'none').attr('stroke', 'rgba(96,165,250,.45)')
    .attr('stroke-width', 10).attr('filter', 'url(#glow)').style('display', 'none');
  spherePath = viewport.append('path')
    .attr('fill', 'url(#oceanGrad)').attr('stroke', 'rgba(255,255,255,.12)').attr('stroke-width', 1);
  graticulePath = viewport.append('path')
    .attr('fill', 'none').attr('stroke', 'rgba(255,255,255,.045)').attr('stroke-width', 0.5);

  paths = viewport.append('g').attr('id', 'countries')
    .selectAll('path').data(countries.features).join('path')
    .attr('d', path)
    .on('click', (event, d) => {
      initAudio();
      if (mode === 'explore') highlightAndShow(d);
      else if (mode === 'quiz') answerCountry(d);
    })
    .on('mousemove', moveTooltip)
    .on('mouseleave', () => tooltip.style.display = 'none');

  updateLandColors();
  redrawAll();

  zoom = d3.zoom().scaleExtent([1, 25]).translateExtent([[0, 0], [W, H]])
    .on('zoom', event => viewport.attr('transform', event.transform));
  svg.call(zoom);

  globeDrag = d3.drag().clickDistance(5)
    .on('start', () => svg.interrupt())
    .on('drag', (event) => {
      const k = 57.2958 / projection.scale();
      const r = projection.rotate();
      const phi = Math.max(-85, Math.min(85, r[1] - event.dy * k));
      projection.rotate([r[0] + event.dx * k, phi, 0]);
      redrawAll();
    });

  let touchStartDist = 0, touchStartScale = 0;
  svg.on('touchstart.pinch', function(event) {
    if (event.touches.length === 2) {
      event.preventDefault();
      touchStartDist = getDistance(event.touches[0], event.touches[1]);
      touchStartScale = mapMode === 'globe' ? projection.scale() : d3.zoomTransform(svg.node()).k;
    }
  });
  svg.on('touchmove.pinch', function(event) {
    if (event.touches.length === 2) {
      event.preventDefault();
      const dist = getDistance(event.touches[0], event.touches[1]);
      const scale = touchStartScale * (dist / touchStartDist);
      if (mapMode === 'globe') {
        const newScale = Math.max(globeScaleDefault * 0.7, Math.min(globeScaleDefault * 5, scale));
        projection.scale(newScale); redrawAll();
      } else {
        const newScale = Math.max(1, Math.min(25, scale));
        svg.call(zoom.transform, d3.zoomIdentity.scale(newScale));
      }
    }
  });
  function getDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  ready = true;
  setMode('explore');
}

function highlightAndShow(d) {
  const key = featureKey(d);
  
  if (highlightedFeature) {
    highlightedFeature.__highlighted = false;
  }
  
  d.__highlighted = true;
  highlightedFeature = d;
  updateLandColors();
  
  playClick();
  if (DB[key]) trackExplore(key);
  
  setTimeout(() => {
    showCountryCard(key, d);
    zoomTo(d);
  }, 400);
}

function redrawAll() {
  spherePath.attr('d', path({ type: 'Sphere' }));
  graticulePath.attr('d', path(d3.geoGraticule10()));
  haloPath.attr('d', path({ type: 'Sphere' }));
  paths.attr('d', path);
}

function setMapMode(m) {
  if (!ready || mapMode === m) return;
  mapMode = m;
  document.getElementById('view-flat').classList.toggle('active', m === 'flat');
  document.getElementById('view-globe').classList.toggle('active', m === 'globe');
  tooltip.style.display = 'none';
  svg.interrupt();
  playClick();
  
  if (m === 'globe') {
    stats.globeSwitches = (stats.globeSwitches || 0) + 1;
    saveStats();
    checkAchievements();
  }

  if (m === 'flat') {
    svg.on('.drag', null);
    projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [W - 10, H - 10]], { type: 'Sphere' });
    haloPath.style('display', 'none');
    svg.call(zoom);
    svg.call(zoom.transform, d3.zoomIdentity);
  } else {
    svg.on('.zoom', null);
    viewport.attr('transform', null);
    projection = d3.geoOrthographic().clipAngle(90)
      .fitExtent([[30, 30], [W - 30, H - 30]], { type: 'Sphere' });
    globeScaleDefault = projection.scale();
    projection.rotate(GLOBE_ROT0);
    haloPath.style('display', null);
    svg.call(globeDrag);
  }
  path = d3.geoPath(projection);
  redrawAll();
  updateLandColors();
  if (mode === 'explore') showExplorePrompt();
}

function moveTooltip(event, d) {
  if (mode !== 'explore') { tooltip.style.display = 'none'; return; }
  const c = DB[featureKey(d)];
  tooltip.textContent = c ? c.name : (d.properties && d.properties.name) || '';
  tooltip.style.display = 'block';
  tooltip.style.left = (event.clientX + 14) + 'px';
  tooltip.style.top = (event.clientY + 16) + 'px';
}

function zoomTo(d) {
  if (mapMode === 'globe') { rotateTo(d); return; }
  const [[x0, y0], [x1, y1]] = path.bounds(d);
  const scale = Math.max(1, Math.min(12, 0.65 / Math.max((x1 - x0) / W, (y1 - y0) / H)));
  const tx = W / 2 - scale * (x0 + x1) / 2;
  const ty = H / 2 - scale * (y0 + y1) / 2;
  svg.transition().duration(800).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function rotateTo(d) {
  const [lambda, phi] = d3.geoCentroid(d);
  const r0 = projection.rotate();
  let tl = -lambda;
  while (tl - r0[0] > 180) tl -= 360;
  while (tl - r0[0] < -180) tl += 360;
  const target = [tl, Math.max(-85, Math.min(85, -phi)), 0];
  const i = d3.interpolate(r0, target);
  svg.transition('rot').duration(800).ease(d3.easeCubicInOut)
    .tween('rotate', () => t => { projection.rotate(i(t)); redrawAll(); });
}

function resetZoom() {
  if (!ready) return;
  playClick();
  if (highlightedFeature) {
    highlightedFeature.__highlighted = false;
    highlightedFeature = null;
    updateLandColors();
  }
  if (mapMode === 'flat') {
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
  } else {
    const r0 = projection.rotate();
    let tl = GLOBE_ROT0[0];
    while (tl - r0[0] > 180) tl -= 360;
    while (tl - r0[0] < -180) tl += 360;
    const iR = d3.interpolate(r0, [tl, GLOBE_ROT0[1], 0]);
    const iS = d3.interpolate(projection.scale(), globeScaleDefault);
    svg.transition('rot').duration(600)
      .tween('reset', () => t => { projection.rotate(iR(t)); projection.scale(iS(t)); redrawAll(); });
  }
}

function zoomBy(k) {
  if (!ready) return;
  playClick();
  if (mapMode === 'flat') {
    svg.transition().duration(300).call(zoom.scaleBy, k);
  } else {
    const s0 = projection.scale();
    const s1 = Math.max(globeScaleDefault * 0.7, Math.min(globeScaleDefault * 5, s0 * k));
    svg.transition('zoomGlobe').duration(250).tween('scale', () => {
      const i = d3.interpolate(s0, s1);
      return t => { projection.scale(i(t)); redrawAll(); };
    });
  }
}

function clearFlash() { if (paths) paths.classed('flash-correct', false).classed('flash-wrong', false); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function setMode(m) {
  if (!ready) return;
  clearTimeout(advanceTimer);
  stopTimer();
  mode = m;
  if (m !== 'quiz') { quiz = null; clearFlash(); }
  if (m === 'explore') resetZoom();
  tooltip.style.display = 'none';
  document.getElementById('btn-explore').classList.toggle('active', m === 'explore');
  document.getElementById('btn-quiz').classList.toggle('active', m !== 'explore');
  if (m === 'explore') showExplorePrompt();
  if (m === 'setup') renderSetup();
  collapsePanel();
  playClick();
}

function showExplorePrompt() {
  const n = Object.keys(DB).filter(k => featureByKey[k]).length;
  const hint = mapMode === 'globe'
    ? '🌐 Перетаскивай, чтобы вращать глобус · щипок — масштаб'
    : '🖱️ Колёсико — масштаб · перетаскивание — перемещение';
  panelContent.innerHTML = `
    <div class="fade">
      <h2>🧭 Исследование</h2>
      <p>Наводи на страны и кликай, чтобы узнать название, столицу и флаг.</p>
      <p class="dim">${hint}</p>
      <p class="dim">В базе <b>${n}</b> стран и территорий.</p>
      <div class="btn-row">
        <button class="btn primary" onclick="setMode('setup')">🎯 Викторина</button>
        <button class="btn" onclick="openModal('achievements')">🏆 Ачивки</button>
        <button class="btn" onclick="openModal('stats')">📊 Статистика</button>
      </div>
    </div>`;
  setHandleTitle('🧭 Исследование');
}

function showCountryCard(key, feature) {
  const c = DB[key];
  const back = `<div class="btn-row"><button class="btn ghost" onclick="showExplorePrompt()">← Назад</button></div>`;
  if (c) {
    const lvl = LEVELS[c.level];
    const err = stats.countryErrors[key] || 0;
    const cor = stats.countryCorrect[key] || 0;
    const statLine = (err + cor) > 0 ? `<p class="dim">📊 Твои ответы: ✅ ${cor} · ❌ ${err}</p>` : '';
    panelContent.innerHTML = `
      <div class="fade">
        ${flagImg(c.flag, 'flag-wrap card-flag')}
        <h2>${c.name}</h2>
        <p class="en-name">${(feature.properties && feature.properties.name) || ''} · ${lvl.icon} ${lvl.name}</p>
        <p class="capital">🏛️ Столица: <b>${c.capital}</b></p>
        ${statLine}
        ${back}
      </div>`;
    setHandleTitle(c.name);
  } else {
    const name = (feature.properties && feature.properties.name) || 'Неизвестная территория';
    panelContent.innerHTML = `
      <div class="fade">
        <h2>${name}</h2>
        <p class="dim">Эта территория не входит в базу игры.</p>
        ${back}
      </div>`;
    setHandleTitle(name);
  }
  if (isMobile()) panel.classList.add('expanded');
}

function renderSetup() {
  const chips = Object.entries(LEVELS).map(([k, l]) =>
    `<button class="chip ${selectedLevel === k ? 'active' : ''}" onclick="selectLevel('${k}')">
      ${l.icon} ${l.name}<span class="chip-count">${poolFor(k).length}</span>
    </button>`).join('');
  const key = selectedLevel + (selectedBlitz ? '-blitz' : '-classic');
  const rec = loadRecords()[key];
  panelContent.innerHTML = `
    <div class="fade">
      <h2>🎯 Викторина</h2>
      <div class="section-label">Уровень</div>
      <div class="chips">${chips}</div>
      <div class="section-label">Режим</div>
      <div class="chips">
        <button class="chip ${!selectedBlitz ? 'active' : ''}" onclick="selectTime(false)">♾️ Классика</button>
        <button class="chip ${selectedBlitz ? 'active' : ''}" onclick="selectTime(true)">⚡ Блиц · ${QUESTION_TIME} сек</button>
      </div>
      <div class="record-line">${rec ? `🏆 Твой рекорд: <b>${rec.score}/10</b> · ${rec.date}` : '🏆 Рекорда пока нет — установи его!'}</div>
      <button class="btn primary big" onclick="startQuiz()">▶ Начать игру</button>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn" onclick="openModal('achievements')" style="flex:1">🏆 Ачивки (${unlockedAchievements.size}/${ACHIEVEMENTS.length})</button>
        <button class="btn" onclick="openModal('stats')" style="flex:1">📊 Статистика</button>
      </div>
    </div>`;
  setHandleTitle('🎯 Викторина');
  if (isMobile()) panel.classList.add('expanded');
}

function selectLevel(k) { selectedLevel = k; playClick(); renderSetup(); }
function selectTime(b) { selectedBlitz = b; playClick(); renderSetup(); }

function startQuiz() {
  if (!ready) return;
  initAudio();
  clearTimeout(advanceTimer);
  stopTimer();
  clearFlash();
  resetZoom();
  mode = 'quiz';
  const pool = shuffle(poolFor(selectedLevel)).slice(0, 10);
  quiz = {
    level: selectedLevel, blitz: selectedBlitz,
    questions: pool.map(k => ({ id: k, type: randType() })),
    current: 0, score: 0, answered: false
  };
  document.getElementById('btn-explore').classList.remove('active');
  document.getElementById('btn-quiz').classList.add('active');
  renderQuizQuestion();
  collapsePanel();
  playClick();
}

function renderQuizQuestion() {
  quiz.answered = false;
  const q = quiz.questions[quiz.current];
  const c = DB[q.id];
  const lvl = LEVELS[quiz.level];
  let title, target;
  if (q.type === 'name') { title = 'Найди страну'; target = `<div class="q-target">${c.name}</div>`; }
  else if (q.type === 'flag') { title = 'Найди страну по флагу'; target = flagImg(c.flag); }
  else { title = 'Найди страну со столицей'; target = `<div class="q-target">${c.capital}</div>`; }

  panelContent.innerHTML = `
    <div class="fade">
      <div class="quiz-top">
        <span class="pill">${lvl.icon} ${lvl.name}</span>
        <span class="pill">${quiz.blitz ? '⚡ Блиц' : '♾️ Классика'}</span>
        <span class="pill">${quiz.current + 1}/${quiz.questions.length}</span>
        <span class="pill score-pill">⭐ ${quiz.score}</span>
      </div>
      ${quiz.blitz ? `<div class="timer"><div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div><span id="timer-num">${QUESTION_TIME}</span></div>` : ''}
      <h2 class="q-title">${title}</h2>
      ${target}
      <div id="q-feedback"></div>
      <div class="btn-row">
        ${quiz.blitz ? '' : `<button id="q-next" class="btn primary hidden" onclick="nextQuestion()">Далее →</button>`}
        <button class="btn ghost" onclick="setMode('setup')">Выйти</button>
      </div>
    </div>`;
  setHandleTitle(`${title}: ${q.type === 'flag' ? '🚩' : (q.type === 'name' ? c.name : c.capital)}`);
  if (quiz.blitz) startTimer();
}

function startTimer() {
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimerUI();
  timerId = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) { stopTimer(); onTimeout(); }
    updateTimerUI();
  }, 100);
}

function updateTimerUI() {
  const bar = document.getElementById('timer-bar');
  const num = document.getElementById('timer-num');
  if (bar) {
    bar.style.width = Math.max(0, timeLeft / QUESTION_TIME * 100) + '%';
    bar.classList.toggle('low', timeLeft <= 5);
  }
  if (num) num.textContent = Math.max(0, Math.ceil(timeLeft));
}

function onTimeout() { if (quiz && !quiz.answered) answerCountry(null); }

function answerCountry(d) {
  if (mode !== 'quiz' || !quiz || quiz.answered) return;
  quiz.answered = true;
  stopTimer();
  const q = quiz.questions[quiz.current];
  const clickedKey = d ? featureKey(d) : null;
  const correct = clickedKey === q.id;
  
  if (correct) {
    quiz.score++;
    trackCorrect(q.id);
    playCorrect();
  } else {
    trackError(q.id);
    if (clickedKey && clickedKey !== q.id) trackError(clickedKey);
    playWrong();
  }
  
  if (d) paths.filter(p => p === d).classed(correct ? 'flash-correct' : 'flash-wrong', true);
  const cf = featureByKey[q.id];
  if (!correct && cf) paths.filter(p => p === cf).classed('flash-correct', true);
  
  showQuizFeedback(correct, q, !d);
  if (cf) zoomTo(cf);
  if (quiz.blitz) {
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(nextQuestion, 1600);
  }
}

function showQuizFeedback(correct, q, timeout) {
  const c = DB[q.id];
  const fb = document.getElementById('q-feedback');
  if (correct) { fb.className = 'good'; fb.textContent = `✅ Верно! Это ${c.name}.`; }
  else if (timeout) { fb.className = 'bad'; fb.textContent = `⏰ Время вышло! Это ${c.name}.`; }
  else { fb.className = 'bad'; fb.textContent = `❌ Мимо. Правильный ответ — ${c.name}.`; }
  const nb = document.getElementById('q-next');
  if (nb) nb.classList.remove('hidden');
}

function nextQuestion() {
  clearTimeout(advanceTimer);
  stopTimer();
  clearFlash();
  quiz.current++;
  if (quiz.current >= quiz.questions.length) showResults();
  else { resetZoom(); renderQuizQuestion(); }
}

function showResults() {
  stopTimer();
  const total = quiz.questions.length;
  const records = loadRecords();
  const key = recordKey();
  const prev = records[key];
  const isRecord = !prev || quiz.score > prev.score;
  if (isRecord) {
    records[key] = { score: quiz.score, date: new Date().toLocaleDateString('ru-RU') };
    saveRecords(records);
  }
  
  trackGameEnd(quiz.score, total, quiz.level, quiz.blitz);
  
  const pct = quiz.score / total;
  const msg = pct === 1 ? 'Идеально! Ты знаешь весь мир!'
    : pct >= .8 ? 'Отличный результат!'
    : pct >= .5 ? 'Хороший результат, продолжай!'
    : 'Потренируйся ещё — всё получится!';
  
  panelContent.innerHTML = `
    <div class="fade center">
      <h2>🏁 Игра окончена!</h2>
      <div class="big-score">${quiz.score}<span class="big-total">/${total}</span></div>
      ${isRecord ? '<div class="new-record">🏆 Новый рекорд!</div>' : (prev ? `<div class="dim">Твой рекорд: ${prev.score}/${total}</div>` : '')}
      <p>${msg}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" onclick="startQuiz()">🔄 Ещё раз</button>
        <button class="btn" onclick="setMode('setup')">⚙️ Уровни</button>
        <button class="btn" onclick="setMode('explore')">🧭 Карта</button>
      </div>
    </div>`;
  setHandleTitle(`🏁 ${quiz.score}/${total}`);
  resetZoom();
  if (isMobile()) panel.classList.add('expanded');
  
  if (isRecord) setTimeout(playRecord, 400);
}
</script>
</body>
</html>
