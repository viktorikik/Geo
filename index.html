<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 ГеоМастер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="particles"></canvas>

<svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0" class="ocean-stop-1"/>
      <stop offset="1" class="ocean-stop-2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g id="viewport"></g>
</svg>

<div class="hud">
  <div class="logo">
    <span class="logo-text">🌍 Гео<span class="grad">Мастер</span></span>
    <button class="icon-btn" id="sound-toggle" aria-label="Звук">🔊</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Тема">🌙</button>
    <button class="icon-btn" id="search-btn" aria-label="Поиск">🔍</button>
  </div>
  <div class="level-bar">
    <span id="level-icon">🌱</span>
    <span id="level-name">Новичок</span>
    <div class="track"><div class="fill" id="level-fill"></div></div>
  </div>
  <div class="modes">
    <button class="mode-btn active" data-mode="explore">🧭 Карта</button>
    <button class="mode-btn" data-mode="setup">🎯 Викторина</button>
    <button class="mode-btn" data-mode="learn">📖 Учить</button>
  </div>
  <div class="views">
    <button class="view-btn active" data-view="flat">🗺️ Плоская</button>
    <button class="view-btn" data-view="globe">🌐 Глобус</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-handle" id="panel-handle">
    <div class="panel-handle-bar"></div>
    <div class="panel-handle-title" id="panel-handle-title">🧭 Исследование</div>
  </div>
  <div class="panel-content" id="panel-content">
    <div class="skeleton"></div>
  </div>
</div>

<div class="zoom-controls">
  <button data-zoom="in" aria-label="Приблизить">+</button>
  <button data-zoom="out" aria-label="Отдалить">−</button>
  <button data-zoom="reset" aria-label="Сброс">⌂</button>
</div>

<div id="tooltip"></div>

<div class="modal-overlay" id="modal-country"><div class="modal" id="modal-country-content"></div></div>
<div class="modal-overlay" id="modal-achievements"><div class="modal" id="modal-achievements-content"></div></div>
<div class="modal-overlay" id="modal-stats"><div class="modal" id="modal-stats-content"></div></div>
<div class="modal-overlay" id="modal-daily"><div class="modal" id="modal-daily-content"></div></div>
<div class="modal-overlay" id="modal-search"><div class="modal" id="modal-search-content"></div></div>
<div class="modal-overlay" id="modal-compare"><div class="modal" id="modal-compare-content"></div></div>
<div class="modal-overlay" id="modal-onboarding"><div class="modal" id="modal-onboarding-content"></div></div>
<div class="modal-overlay" id="modal-confirm"><div class="modal" id="modal-confirm-content"></div></div>

<div class="toast-container" id="toast-container"></div>

<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
