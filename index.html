<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 ГеоМастер</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
:root{
--bg:#070b16;--bg2:rgba(139,92,246,.16);--bg3:rgba(6,182,212,.12);
--tx:#eef1ff;--tx2:rgba(238,241,255,.8);--tx3:rgba(238,241,255,.5);
--pn:rgba(11,16,32,.75);--pb:rgba(255,255,255,.09);
--bb:rgba(255,255,255,.06);--br:rgba(255,255,255,.1);--bh:rgba(255,255,255,.12);
--a1:#8b5cf6;--a2:#06b6d4;
--o1:#1a4d6e;--o2:#0f2d47;
--lk:#5a8f6a;--lu:#4a6b5a;--lb:#2d4a3a;
--hl:#10b981;--hs:#34d399;
--ov:rgba(0,0,0,.6);--sk:rgba(255,255,255,.06);
}
[data-theme="light"]{
--bg:#f0f4f8;--bg2:rgba(139,92,246,.08);--bg3:rgba(6,182,212,.06);
--tx:#1a202c;--tx2:rgba(26,32,44,.8);--tx3:rgba(26,32,44,.5);
--pn:rgba(255,255,255,.88);--pb:rgba(0,0,0,.08);
--bb:rgba(0,0,0,.04);--br:rgba(0,0,0,.1);--bh:rgba(0,0,0,.08);
--o1:#4a90e2;--o2:#357abd;--lk:#8bc34a;--lu:#a5d6a7;--lb:#689f38;
--hl:#ff9800;--hs:#ffb74d;--ov:rgba(0,0,0,.35);--sk:rgba(0,0,0,.06);
}
[data-theme="retro"]{
--bg:#2c2416;--bg2:rgba(180,140,80,.12);--bg3:rgba(160,120,60,.08);
--tx:#e8d5b0;--tx2:rgba(232,213,176,.8);--tx3:rgba(232,213,176,.5);
--pn:rgba(44,36,22,.85);--pb:rgba(180,140,80,.2);
--bb:rgba(180,140,80,.1);--br:rgba(180,140,80,.2);--bh:rgba(180,140,80,.18);
--a1:#c4944a;--a2:#8b6d3a;
--o1:#3a5a6a;--o2:#2a4050;--lk:#7a8a5a;--lu:#5a6a4a;--lb:#4a5a3a;
--hl:#d4a44a;--hs:#e8c060;--ov:rgba(0,0,0,.6);--sk:rgba(180,140,80,.08);
}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--tx);
background:radial-gradient(1200px 800px at 80% -10%,var(--bg2),transparent 60%),
radial-gradient(1000px 700px at 10% 110%,var(--bg3),transparent 60%),var(--bg);
touch-action:none;transition:background .4s}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#viewport path{vector-effect:non-scaling-stroke}
#countries path{cursor:pointer;transition:filter .15s}
#countries path:hover{filter:brightness(1.25)}
.flash-correct{fill:#10b981!important}.flash-wrong{fill:#f43f5e!important}

.hud{position:fixed;top:14px;left:14px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.logo{font-size:18px;font-weight:800;background:var(--pn);backdrop-filter:blur(14px);
border:1px solid var(--pb);padding:8px 14px;border-radius:12px;display:flex;align-items:center;gap:8px}
.logo .g{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--pb);background:var(--bb);
cursor:pointer;font-size:16px;transition:.2s;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.ib:hover{background:var(--bh);transform:translateY(-1px)}
.level-bar{display:flex;align-items:center;gap:8px;background:var(--pn);backdrop-filter:blur(14px);
border:1px solid var(--pb);padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700}
.level-bar .track{width:80px;height:5px;border-radius:99px;background:var(--bb);overflow:hidden}
.level-bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .5s}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mb{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;
font-family:inherit;border:1px solid var(--br);background:var(--pn);backdrop-filter:blur(14px);color:var(--tx2)}
.mb:hover{color:var(--tx);background:var(--bh)}.mb.active{color:#fff;border-color:transparent;
background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 16px rgba(139,92,246,.35)}
.views{display:flex;padding:2px;border-radius:10px;background:var(--pn);backdrop-filter:blur(14px);border:1px solid var(--pb)}
.vb{border:none;background:transparent;color:var(--tx3);cursor:pointer;transition:.2s;
font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px}
.vb:hover{color:var(--tx)}.vb.active{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 3px 10px rgba(139,92,246,.3)}

.panel{position:fixed;top:14px;right:14px;width:330px;z-index:10;
background:var(--pn);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
border:1px solid var(--pb);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4);
max-height:calc(100vh - 28px);overflow-y:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.panel h2{font-size:20px;font-weight:800;margin-bottom:8px}
.panel p{line-height:1.5;margin-bottom:8px;font-size:14px}
.dim{opacity:.5;font-size:13px}.en{opacity:.45;font-size:12px}

.fade{animation:fadeUp .3s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.45;margin:14px 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;
cursor:pointer;transition:.2s;font-family:inherit;border:1px solid var(--br);background:var(--bb);color:var(--tx2)}
.ch:hover{background:var(--bh)}.ch.active{background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(6,182,212,.9));
border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.ch-c{font-size:10px;opacity:.7;background:rgba(0,0,0,.2);padding:1px 6px;border-radius:99px}
.rl{font-size:13px;margin:14px 0;padding:10px 12px;background:var(--bb);border:1px solid var(--br);border-radius:12px}

.qt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bb);border:1px solid var(--br)}
.sp{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.25)}
.streak-pill{background:rgba(251,146,60,.15);border-color:rgba(251,146,60,.3);color:#fb923c}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tt{flex:1;height:6px;border-radius:99px;background:var(--bb);overflow:hidden}
.tb{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .1s linear}
.tb.low{background:linear-gradient(90deg,#f43f5e,#fb923c)}
#tn{font-weight:800;min-width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}

.qtitle{font-size:16px;font-weight:600;opacity:.85;margin-bottom:3px}
.qtarget{font-size:28px;font-weight:800;margin:4px 0 12px;line-height:1.2;
background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.fw img{width:100%;max-width:220px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);margin:4px 0 12px}
.qe{font-size:56px;margin:4px 0 12px}
#qf{min-height:20px;font-weight:700;font-size:14px;margin:6px 0 3px}
#qf.good{color:#34d399}#qf.bad{color:#fb7185}
.hint-box{padding:10px 12px;border-radius:10px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);
font-size:13px;margin:8px 0;color:var(--tx2)}

.br{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
font-family:inherit;border:1px solid var(--br);background:var(--bb);color:var(--tx)}
.btn:hover{background:var(--bh);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;box-shadow:0 6px 20px rgba(139,92,246,.3);color:#fff}
.btn.p:hover{filter:brightness(1.1);box-shadow:0 8px 24px rgba(139,92,246,.4)}
.btn.big{width:100%;padding:12px;font-size:15px}
.btn.ghost{background:transparent;border-color:transparent;opacity:.65}
.btn.ghost:hover{opacity:1;background:var(--bh)}
.btn.sm{padding:7px 12px;font-size:12px}

.center{text-align:center}
.bs{font-size:52px;font-weight:800;margin:10px 0 3px;
background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bt{font-size:26px}.nr{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;margin:6px 0;
background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(251,146,60,.15));
border:1px solid rgba(250,204,21,.35);color:#fde68a;animation:pulse 1.3s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.zc{position:fixed;bottom:18px;right:18px;z-index:10;display:flex;flex-direction:column;gap:5px}
.zc button{width:40px;height:40px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;transition:.2s;
border:1px solid var(--br);background:var(--pn);backdrop-filter:blur(14px);color:var(--tx)}
.zc button:hover{background:var(--bh)}
#tooltip{position:fixed;display:none;z-index:30;pointer-events:none;white-space:nowrap;
background:var(--pn);backdrop-filter:blur(10px);border:1px solid var(--pb);color:var(--tx);
padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}

.ph{display:none;width:100%;padding:8px 0 4px;cursor:pointer;text-align:center;user-select:none}
.phb{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 6px}
.pht{font-size:13px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%;margin:0 auto}

/* Модалки */
.mo{position:fixed;inset:0;z-index:100;background:var(--ov);backdrop-filter:blur(6px);
display:flex;align-items:center;justify-content:center;padding:16px;
opacity:0;pointer-events:none;transition:opacity .2s}
.mo.show{opacity:1;pointer-events:auto}
.md{background:var(--pn);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
border:1px solid var(--pb);border-radius:20px;padding:22px;
max-width:460px;width:100%;max-height:80vh;overflow-y:auto;
box-shadow:0 24px 60px rgba(0,0,0,.5);transform:scale(.95) translateY(8px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mo.show .md{transform:scale(1) translateY(0)}
.md::-webkit-scrollbar{width:5px}.md::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{font-size:20px;margin:0}
.cb{width:30px;height:30px;border-radius:8px;border:1px solid var(--br);background:var(--bb);
cursor:pointer;font-size:16px;color:var(--tx);display:flex;align-items:center;justify-content:center;transition:.2s}
.cb:hover{background:var(--bh)}

/* Карточка страны */
.country-card{text-align:center}
.country-card h2{font-size:24px;margin:8px 0 4px}
.country-card .facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;text-align:left}
.country-card .fact{padding:8px 10px;border-radius:8px;background:var(--bb);border:1px solid var(--br);font-size:12px}
.country-card .fact b{display:block;font-size:13px;margin-bottom:2px}
.country-card .fun-fact{padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(6,182,212,.1));
border:1px solid rgba(139,92,246,.15);font-size:13px;line-height:1.4;margin:10px 0;text-align:left}

/* Обучение */
.learn-card{text-align:center;padding:10px 0}
.learn-card .nav{display:flex;justify-content:center;gap:12px;margin-top:14px}

/* Сравнение */
.compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.compare-col{text-align:center;padding:12px;border-radius:12px;background:var(--bb);border:1px solid var(--br)}
.compare-col h3{font-size:16px;margin:6px 0}
.compare-col .cf{font-size:12px;opacity:.7;margin:3px 0}

/* Поиск */
.search-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--br);
background:var(--bb);color:var(--tx);font-size:16px;font-family:inherit;outline:none;margin-bottom:12px}
.search-input:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.search-results{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.sr-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px;font-size:14px}
.sr-item:hover{background:var(--bh)}

/* Ежедневные задания */
.daily-list{display:flex;flex-direction:column;gap:8px}
.daily-item{padding:12px;border-radius:12px;background:var(--bb);border:1px solid var(--br);display:flex;align-items:center;gap:10px}
.daily-item.done{opacity:.5;text-decoration:line-through}
.daily-icon{font-size:24px}.daily-info{flex:1}.daily-name{font-size:14px;font-weight:700}.daily-desc{font-size:12px;opacity:.6}
.daily-reward{font-size:12px;font-weight:700;color:var(--a1)}

/* Ачивки */
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ac{padding:12px 8px;border-radius:12px;text-align:center;background:var(--bb);border:1px solid var(--br);transition:.2s;position:relative}
.ac.u{background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(6,182,212,.12));border-color:rgba(139,92,246,.25);box-shadow:0 3px 10px rgba(139,92,246,.15)}
.ac.l{opacity:.45;filter:grayscale(.6)}
.ac-i{font-size:28px;margin-bottom:4px}.ac-n{font-size:12px;font-weight:700;margin-bottom:2px}.ac-d{font-size:10px;opacity:.65;line-height:1.3}
.ac-lk{position:absolute;top:4px;right:4px;font-size:10px;opacity:.5}

/* Статистика */
.ss{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.sb{padding:10px 6px;border-radius:10px;text-align:center;background:var(--bb);border:1px solid var(--br)}
.sv{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sla{font-size:10px;opacity:.55;margin-top:2px}
.donut-wrap{display:flex;justify-content:center;margin:12px 0}
.wl{display:flex;flex-direction:column;gap:5px;max-height:250px;overflow-y:auto}
.wi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bb);border:1px solid var(--br)}
.wfl{font-size:20px}.winf{flex:1;min-width:0}.wn{font-size:13px;font-weight:700}
.wb{height:3px;border-radius:99px;background:var(--br);margin-top:3px;overflow:hidden}
.wf{height:100%;background:linear-gradient(90deg,#f43f5e,#fb923c);border-radius:99px}
.wp{font-size:11px;font-weight:700;opacity:.65;min-width:36px;text-align:right}
.cont-progress{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.cp-item{display:flex;align-items:center;gap:8px;font-size:13px}
.cp-bar{flex:1;height:6px;border-radius:99px;background:var(--bb);overflow:hidden}
.cp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .5s}
.cp-pct{font-size:11px;font-weight:700;opacity:.6;min-width:32px;text-align:right}

.es{display:flex;flex-direction:column;gap:6px}
.es-empty{text-align:center;padding:24px 10px;opacity:.5}
.es-empty .be{font-size:40px;margin-bottom:8px}

/* Скелетон */
.skeleton{display:flex;flex-direction:column;gap:12px;padding:20px}
.sk-block{height:20px;border-radius:8px;background:var(--sk);animation:skPulse 1.5s ease infinite}
.sk-block.w60{width:60%}.sk-block.w80{width:80%}.sk-block.w40{width:40%}.sk-block.h40{height:40px}
@keyframes skPulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* Onboarding */
.onboard{text-align:center}
.onboard h2{font-size:26px;margin-bottom:8px}
.onboard p{font-size:15px;opacity:.7;margin-bottom:16px}
.onboard .ob-icon{font-size:64px;margin-bottom:12px}
.ob-dots{display:flex;justify-content:center;gap:6px;margin:16px 0}
.ob-dot{width:8px;height:8px;border-radius:99px;background:var(--br);transition:.2s}
.ob-dot.active{background:var(--a1);width:20px}

/* Тосты */
.tc{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;
display:flex;flex-direction:column;gap:6px;pointer-events:none;width:90%;max-width:340px}
.toast{background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(6,182,212,.95));
color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(139,92,246,.4);
display:flex;align-items:center;gap:10px;animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;pointer-events:auto}
.toast.out{animation:toastOut .25s ease both}
.toast-i{font-size:24px}.toast-t{flex:1}.toast-ti{font-size:13px;font-weight:800}.toast-de{font-size:11px;opacity:.85}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(.9)}}

@media(max-width:700px){
.hud{top:8px;left:8px;gap:6px}.logo{font-size:14px;padding:6px 10px}
.ib{width:30px;height:30px;font-size:14px}.mb{padding:7px 10px;font-size:12px}
.vb{padding:5px 8px;font-size:11px}.level-bar{padding:4px 8px;font-size:11px}.level-bar .track{width:50px}
.zc{bottom:auto;top:40%;right:8px}.zc button{width:36px;height:36px;font-size:16px}
.qtarget{font-size:22px}
.panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:70vh;padding:0 14px 14px;
border-radius:20px 20px 0 0;transform:translateY(calc(100% - 52px))}
.panel.expanded{transform:translateY(0)}.ph{display:block}
.pc{opacity:0;pointer-events:none;transition:opacity .2s .1s}.panel.expanded .pc{opacity:1;pointer-events:auto}
.md{padding:16px;max-width:95vw}.ag{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.ss{grid-template-columns:repeat(3,1fr);gap:4px}.sv{font-size:16px}
.compare-cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<svg id="map" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">
<defs>
<radialGradient id="oG" cx="50%" cy="45%" r="75%"><stop offset="0" class="os1"/><stop offset="1" class="os2"/></radialGradient>
<filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<g id="viewport"></g>
</svg>

<div class="hud">
<div class="logo">🌍 Гео<span class="g">Мастер</span>
<button class="ib" id="snd" onclick="toggleSound()">🔊</button>
<button class="ib" id="thm" onclick="cycleTheme()">🌙</button>
<button class="ib" onclick="openSearch()">🔍</button>
</div>
<div class="level-bar" id="level-bar"><span id="lvl-icon">🌱</span><span id="lvl-name">Новичок</span>
<div class="track"><div class="fill" id="lvl-fill" style="width:0%"></div></div></div>
<div class="modes">
<button id="btn-explore" class="mb active" onclick="setMode('explore')">🧭 Карта</button>
<button id="btn-quiz" class="mb" onclick="setMode('setup')">🎯 Викторина</button>
<button id="btn-learn" class="mb" onclick="setMode('learn')">📖 Учить</button>

function clFl(){if(ps)ps.classed('flash-correct',false).classed('flash-wrong',false)}
function stTi(){if(tid){clearInterval(tid);tid=null}}

function setMode(m){if(!ready)return;clearTimeout(at);stTi();mode=m;
if(m!=='quiz'){quiz=null;clFl()}if(m==='explore')resetZoom();tip.style.display='none';
document.getElementById('btn-explore').classList.toggle('active',m==='explore');
document.getElementById('btn-quiz').classList.toggle('active',m==='setup'||m==='quiz');
document.getElementById('btn-learn').classList.toggle('active',m==='learn');
if(m==='explore')sEP();if(m==='setup')rSetup();if(m==='learn')rLearn();collapse();pCl()}

function sEP(){const n=Object.keys(DB).filter(k=>fBK[k]).length;
const h=mm==='globe'?'🌐 Вращай глобус · щипок — масштаб':'🖱️ Колёсико — масштаб · перетаскивание';
pc.innerHTML=`<div class="fade"><h2>🧭 Исследование</h2><p>Кликай по странам, чтобы узнать факты.</p>
<p class="dim">${h}</p><p class="dim">В базе <b>${n}</b> стран.</p>
<div class="br"><button class="btn p" onclick="setMode('setup')">🎯 Викторина</button>
<button class="btn sm" onclick="renderDaily();openMo('daily')">📋 Задания</button>
<button class="btn sm" onclick="renderAch();openMo('ach')">🏆 Ачивки</button>
<button class="btn sm" onclick="renderStats();openMo('stats')">📊 Стат</button></div></div>`;sHT('🧭 Карта')}

// Обучение
let learnIdx=0,learnKeys=[];
function rLearn(){
learnKeys=shuf(Object.keys(DB).filter(k=>fBK[k]));learnIdx=0;rLearnCard()}
function rLearnCard(){
if(learnIdx>=learnKeys.length)learnIdx=0;
const k=learnKeys[learnIdx],c=DB[k],f=F[k];
const factsHtml=f?`<div class="facts"><div class="fact"><b>💰 Валюта</b>${f[0]}</div>
<div class="fact"><b>🗣️ Язык</b>${f[1]}</div><div class="fact"><b>👥 Население</b>${f[2]}</div>
<div class="fact"><b>📐 Площадь</b>${f[3]}</div></div><div class="fun-fact">💡 ${f[4]}</div>`
:`<p class="dim">Столица: ${c.cap}</p>`;
pc.innerHTML=`<div class="learn-card fade">
<h2 style="font-size:18px">📖 Изучение</h2>
<p class="dim">${learnIdx+1} / ${learnKeys.length}</p>
${fI(c.flag)}<h2 style="font-size:22px">${c.name}</h2>
<p class="en">${LV[c.level].i} ${LV[c.level].n} · 🏛️ ${c.cap}</p>
${factsHtml}
<div class="nav"><button class="btn sm" onclick="learnIdx=Math.max(0,learnIdx-1);rLearnCard()">←</button>
<button class="btn p sm" onclick="learnIdx++;rLearnCard()">Далее →</button></div></div>`;
sHT(`📖 ${c.name}`);tEx(k);uDaily('explore');
const feat=fBK[k];if(feat){zoomTo(feat)}}

function rSetup(){
const chips=Object.entries(LV).map(([k,l])=>
`<button class="ch ${sLv===k?'active':''}" onclick="sLv='${k}';pCl();rSetup()">${l.i} ${l.n}<span class="ch-c">${pFor(k).length}</span></button>`).join('');
const key=sLv+(sBl?'-b':'-c'),rec=ldR()[key];
pc.innerHTML=`<div class="fade"><h2>🎯 Викторина</h2>
<div class="sl">Уровень</div><div class="chips">${chips}</div>
<div class="sl">Режим</div><div class="chips">
<button class="ch ${!sBl?'active':''}" onclick="sBl=false;pCl();rSetup()">♾️ Классика</button>
<button class="ch ${sBl?'active':''}" onclick="sBl=true;pCl();rSetup()">⚡ Блиц · ${QT}с</button></div>
<div class="rl">${rec?`🏆 Рекорд: <b>${rec.score}/10</b> · ${rec.date}`:'🏆 Установи рекорд!'}</div>
<button class="btn p big" onclick="startQ()">▶ Начать</button>
<div class="br" style="margin-top:8px">
<button class="btn sm" onclick="renderAch();openMo('ach')" style="flex:1">🏆 ${ua.size}/${ACH.length}</button>
<button class="btn sm" onclick="renderStats();openMo('stats')" style="flex:1">📊 Стат</button></div></div>`;
sHT('🎯 Викторина');if(isMob())pnl.classList.add('expanded')}

function startQ(){if(!ready)return;iA();clearTimeout(at);stTi();clFl();resetZoom();mode='quiz';
const pool=shuf(pFor(sLv)).slice(0,10);
quiz={level:sLv,blitz:sBl,questions:pool.map(k=>({id:k,type:rT()})),cur:0,score:0,ans:false,streak:0,hints:0};
document.getElementById('btn-explore').classList.remove('active');
document.getElementById('btn-quiz').classList.add('active');rQQ();collapse();pCl()}

function rQQ(){quiz.ans=false;const q=quiz.questions[quiz.cur],c=DB[q.id],l=LV[quiz.level];
let ti,tg;if(q.type==='name'){ti='Найди страну';tg=`<div class="qtarget">${c.name}</div>`}
else if(q.type==='flag'){ti='Найди по флагу';tg=fI(c.flag)}
else{ti='Найди по столице';tg=`<div class="qtarget">${c.cap}</div>`}

const streakHtml=quiz.streak>=2?`<span class="pill streak-pill">🔥 ${quiz.streak}</span>`:'';
pc.innerHTML=`<div class="fade"><div class="qt">
<span class="pill">${l.i} ${l.n}</span><span class="pill">${quiz.blitz?'⚡ Блиц':'♾️'}</span>
<span class="pill">${quiz.cur+1}/${quiz.questions.length}</span>
<span class="pill sp">⭐ ${quiz.score}</span>${streakHtml}</div>
${quiz.blitz?`<div class="timer"><div class="tt"><div class="tb" id="tbar"></div></div><span id="tn">${QT}</span></div>`:''}
<h2 class="qtitle">${ti}</h2>${tg}
<div id="hint-area"></div><div id="qf"></div>
<div class="br">${quiz.blitz?'':`<button id="qn" class="btn p hidden" onclick="nxtQ()">Далее →</button>`}
<button class="btn sm" onclick="useHint()">💡 Подсказка</button>
<button class="btn sm ghost" onclick="setMode('setup')">Выйти</button></div></div>`;
sHT(`${ti}: ${q.type==='flag'?'🚩':(q.type==='name'?c.name:c.cap)}`);if(quiz.blitz)sTimer()}

function useHint(){if(!quiz||quiz.ans||quiz.hints>=2)return;
quiz.hints++;const q=quiz.questions[quiz.cur],c=DB[q.id],l=LV[c.level];
const hint=`${l.i} Континент: <b>${l.n}</b> · Начинается на «<b>${c.name[0]}</b>»`;
document.getElementById('hint-area').innerHTML=`<div class="hint-box">💡 ${hint}</div>`;
toast('💡','Подсказка','−1 очко за подсказку',2000);pCl()}

function sTimer(){stTi();tl=QT;uTU();tid=setInterval(()=>{tl-=.1;if(tl<=0){stTi();onTO()}uTU()},100)}
function uTU(){const b=document.getElementById('tbar'),n=document.getElementById('tn');
if(b){b.style.width=Math.max(0,tl/QT*100)+'%';b.classList.toggle('low',tl<=5)}
if(n)n.textContent=Math.max(0,Math.ceil(tl))}
function onTO(){if(quiz&&!quiz.ans)ansC(null)}

function ansC(d){if(mode!=='quiz'||!quiz||quiz.ans)return;quiz.ans=true;stTi();
const q=quiz.questions[quiz.cur],ck=d?fK(d):null,ok=ck===q.id;
if(ok){quiz.score++;quiz.streak++;st.cs=Math.max(st.cs||0,quiz.streak);
if(quiz.streak>st.ms){st.ms=quiz.streak;sSt()}
tC(q.id);pOk();hap(20);if(quiz.streak>=3&&quiz.streak%3===0)pStreak();uDaily('correct')}
else{quiz.streak=0;tE(q.id);if(ck&&ck!==q.id)tE(ck);pNo();hap(80)}

if(quiz.hints>0&&ok)quiz.score=Math.max(0,quiz.score-quiz.hints);

if(d)ps.filter(p=>p===d).classed(ok?'flash-correct':'flash-wrong',true);
const cf=fBK[q.id];if(!ok&&cf)ps.filter(p=>p===cf).classed('flash-correct',true);
sQF(ok,q,!d);if(cf)zoomTo(cf);
if(quiz.blitz){clearTimeout(at);at=setTimeout(nxtQ,1400)}}

function sQF(ok,q,to){const c=DB[q.id],fb=document.getElementById('qf');
if(ok){fb.className='good';fb.textContent=`✅ Верно! Это ${c.name}.`}
else if(to){fb.className='bad';fb.textContent=`⏰ Время вышло! Это ${c.name}.`}
else{fb.className='bad';fb.textContent=`❌ Мимо. Это ${c.name}.`}
const nb=document.getElementById('qn');if(nb)nb.classList.remove('hidden')}

function nxtQ(){clearTimeout(at);stTi();clFl();quiz.cur++;
if(quiz.cur>=quiz.questions.length)showRes();else{resetZoom();rQQ()}}

function showRes(){stTi();const tot=quiz.questions.length,recs=ldR(),key=rK(),prev=recs[key];
const isR=!prev||quiz.score>prev.score;
if(isR){recs[key]={score:quiz.score,date:new Date().toLocaleDateString('ru-RU')};svR(recs)}
tG(quiz.score,tot,quiz.level,quiz.blitz);uDaily('blitz',quiz.blitz?1:0);uLvl();

const pct=quiz.score/tot,msg=pct===1?'Идеально! 🎉':pct>=.8?'Отлично! 🔥':pct>=.5?'Неплохо! 👍':'Попробуй ещё! 💪';
pc.innerHTML=`<div class="fade center"><h2>🏁 Готово!</h2>
<div class="bs">${quiz.score}<span class="bt">/${tot}</span></div>
${isR?'<div class="nr">🏆 Новый рекорд!</div>':(prev?`<div class="dim">Рекорд: ${prev.score}/${tot}</div>`:'')}
<p>${msg}</p>
<div class="br" style="justify-content:center">
<button class="btn p" onclick="startQ()">🔄 Ещё</button>
<button class="btn sm" onclick="exportResult(${quiz.score},${tot})">📤 Поделиться</button>
<button class="btn sm" onclick="setMode('setup')">⚙️</button>
<button class="btn sm ghost" onclick="setMode('explore')">🧭</button></div></div>`;
sHT(`🏁 ${quiz.score}/${tot}`);resetZoom();if(isMob())pnl.classList.add('expanded');
if(isR)setTimeout(pRec,300)}
</script>
</body>
</html>
