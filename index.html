<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌍 ГеоМастер — интерактивная карта мира</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  
  :root {
    --bg-primary: #070b16;
    --bg-gradient-1: rgba(139,92,246,.16);
    --bg-gradient-2: rgba(6,182,212,.12);
    --text-primary: #eef1ff;
    --text-secondary: rgba(238,241,255,.8);
    --text-dim: rgba(238,241,255,.55);
    --panel-bg: rgba(11,16,32,.75);
    --panel-border: rgba(255,255,255,.09);
    --btn-bg: rgba(255,255,255,.06);
    --btn-border: rgba(255,255,255,.1);
    --btn-hover: rgba(255,255,255,.12);
    --accent-1: #8b5cf6;
    --accent-2: #06b6d4;
    --ocean-1: #1a4d6e;
    --ocean-2: #0f2d47;
    --land-known: #5a8f6a;
    --land-unknown: #4a6b5a;
    --land-border: #2d4a3a;
    --land-highlight: #10b981;
    --land-highlight-stroke: #34d399;
    --overlay-bg: rgba(0,0,0,.6);
    --skeleton-bg: rgba(255,255,255,.06);
  }
  
  [data-theme="light"] {
    --bg-primary: #f0f4f8;
    --bg-gradient-1: rgba(139,92,246,.08);
    --bg-gradient-2: rgba(6,182,212,.06);
    --text-primary: #1a202c;
    --text-secondary: rgba(26,32,44,.8);
    --text-dim: rgba(26,32,44,.55);
    --panel-bg: rgba(255,255,255,.88);
    --panel-border: rgba(0,0,0,.08);
    --btn-bg: rgba(0,0,0,.04);
    --btn-border: rgba(0,0,0,.1);
    --btn-hover: rgba(0,0,0,.08);
    --ocean-1: #4a90e2;
    --ocean-2: #357abd;
    --land-known: #8bc34a;
    --land-unknown: #a5d6a7;
    --land-border: #689f38;
    --land-highlight: #ff9800;
    --land-highlight-stroke: #ffb74d;
    --overlay-bg: rgba(0,0,0,.35);
    --skeleton-bg: rgba(0,0,0,.06);
  }
  
  [data-theme="retro"] {
    --bg-primary: #2c2416;
    --bg-gradient-1: rgba(180,140,80,.12);
    --bg-gradient-2: rgba(160,120,60,.08);
    --text-primary: #e8d5b0;
    --text-secondary: rgba(232,213,176,.8);
    --text-dim: rgba(232,213,176,.5);
    --panel-bg: rgba(44,36,22,.85);
    --panel-border: rgba(180,140,80,.2);
    --btn-bg: rgba(180,140,80,.1);
    --btn-border: rgba(180,140,80,.2);
    --btn-hover: rgba(180,140,80,.18);
    --accent-1: #c4944a;
    --accent-2: #8b6d3a;
    --ocean-1: #3a5a6a;
    --ocean-2: #2a4050;
    --land-known: #7a8a5a;
    --land-unknown: #5a6a4a;
    --land-border: #4a5a3a;
    --land-highlight: #d4a44a;
    --land-highlight-stroke: #e8c060;
    --overlay-bg: rgba(0,0,0,.6);
    --skeleton-bg: rgba(180,140,80,.08);
  }
  
  body {
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(1200px 800px at 80% -10%, var(--bg-gradient-1), transparent 60%),
      radial-gradient(1000px 700px at 10% 110%, var(--bg-gradient-2), transparent 60%),
      var(--bg-primary);
    touch-action: none;
    transition: background .4s ease;
  }
  
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 1; }
  #viewport path { vector-effect: non-scaling-stroke; }
  #countries path { cursor: pointer; transition: filter .15s; }
  #countries path:hover { filter: brightness(1.25); }
  .flash-correct { fill: #10b981 !important; }
  .flash-wrong { fill: #f43f5e !important; }

  .hud { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .logo {
    font-size: 18px; font-weight: 800; letter-spacing: .3px;
    background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border); padding: 8px 14px; border-radius: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .logo .grad {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--panel-border);
    background: var(--btn-bg); cursor: pointer; font-size: 16px; transition: .2s;
    display: flex; align-items: center; justify-content: center; color: var(--text-primary);
  }
  .icon-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  
  .level-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 10px;
    font-size: 12px; font-weight: 700;
  }
  .level-bar .track { width: 80px; height: 5px; border-radius: 99px; background: var(--btn-bg); overflow: hidden; }
  .level-bar .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width .5s; }
  
  .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .mode-btn {
    padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--panel-bg); backdrop-filter: blur(14px); color: var(--text-secondary);
  }
  .mode-btn:hover { color: var(--text-primary); background: var(--btn-hover); }
  .mode-btn.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 4px 16px rgba(139,92,246,.35);
  }
  .views {
    display: flex; padding: 2px; border-radius: 10px;
    background: var(--panel-bg); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
  }
  .view-btn {
    border: none; background: transparent; color: var(--text-dim); cursor: pointer; transition: .2s;
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px;
  }
  .view-btn:hover { color: var(--text-primary); }
  .view-btn.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff;
    box-shadow: 0 3px 10px rgba(139,92,246,.3);
  }

  .panel {
    position: fixed; top: 14px; right: 14px; width: 330px; z-index: 10;
    background: var(--panel-bg); backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid var(--panel-border); border-radius: 20px; padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    max-height: calc(100vh - 28px); overflow-y: auto;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }
  .panel h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .panel p { line-height: 1.5; margin-bottom: 8px; font-size: 14px; }
  .dim { opacity: .5; font-size: 13px; }
  .en-name { opacity: .45; font-size: 12px; }

  .fade { animation: fadeUp .3s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; opacity: .45; margin: 14px 0 6px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--btn-bg); color: var(--text-secondary);
  }
  .chip:hover { background: var(--btn-hover); }
  .chip.active {
    background: linear-gradient(135deg, rgba(139,92,246,.9), rgba(6,182,212,.9));
    border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(139,92,246,.3);
  }
  .chip-count { font-size: 10px; opacity: .7; background: rgba(0,0,0,.2); padding: 1px 6px; border-radius: 99px; }
  .record-line {
    font-size: 13px; margin: 14px 0; padding: 10px 12px;
    background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 12px;
  }

  .quiz-top { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .pill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--btn-bg); border: 1px solid var(--btn-border); }
  .score-pill { background: rgba(250,204,21,.12); border-color: rgba(250,204,21,.25); }
  .streak-pill { background: rgba(251,146,60,.15); border-color: rgba(251,146,60,.3); color: #fb923c; }
  .timer { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .timer-track { flex: 1; height: 6px; border-radius: 99px; background: var(--btn-bg); overflow: hidden; }
  .timer-bar { height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width .1s linear; }
  .timer-bar.low { background: linear-gradient(90deg, #f43f5e, #fb923c); }
  #timer-num { font-weight: 800; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }

  .q-title { font-size: 16px; font-weight: 600; opacity: .85; margin-bottom: 3px; }
  .q-target {
    font-size: 28px; font-weight: 800; margin: 4px 0 12px; line-height: 1.2;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .flag-wrap img { width: 100%; max-width: 220px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); margin: 4px 0 12px; }
  .card-flag img { max-width: none; margin-top: 0; }
  .q-emoji { font-size: 56px; margin: 4px 0 12px; }
  #q-feedback { min-height: 20px; font-weight: 700; font-size: 14px; margin: 6px 0 3px; }
  #q-feedback.good { color: #34d399; }
  #q-feedback.bad { color: #fb7185; }
  .hint-box {
    padding: 10px 12px; border-radius: 10px;
    background: rgba(139,92,246,.12); border: 1px solid rgba(139,92,246,.2);
    font-size: 13px; margin: 8px 0; color: var(--text-secondary);
  }

  .btn-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s;
    font-family: inherit; border: 1px solid var(--btn-border);
    background: var(--btn-bg); color: var(--text-primary);
  }
  .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border: none; box-shadow: 0 6px 20px rgba(139,92,246,.3); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); box-shadow: 0 8px 24px rgba(139,92,246,.4); }
  .btn.big { width: 100%; padding: 12px; font-size: 15px; }
  .btn.small { padding: 7px 12px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: transparent; opacity: .65; }
  .btn.ghost:hover { opacity: 1; background: var(--btn-hover); }

  .center { text-align: center; }
  .big-score {
    font-size: 52px; font-weight: 800; margin: 10px 0 3px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .big-total { font-size: 26px; }
  .new-record {
    display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 800; margin: 6px 0;
    background: linear-gradient(135deg, rgba(250,204,21,.15), rgba(251,146,60,.15));
    border: 1px solid rgba(250,204,21,.35); color: #fde68a;
    animation: pulse 1.3s ease infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .zoom-controls { position: fixed; bottom: 18px; right: 18px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
  .zoom-controls button {
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: .2s;
    border: 1px solid var(--btn-border); background: var(--panel-bg);
    backdrop-filter: blur(14px); color: var(--text-primary);
  }
  .zoom-controls button:hover { background: var(--btn-hover); }

  #tooltip {
    position: fixed; display: none; z-index: 30; pointer-events: none; white-space: nowrap;
    background: var(--panel-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); color: var(--text-primary);
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
  }

  .panel-handle {
    display: none; width: 100%; padding: 8px 0 4px; cursor: pointer;
    text-align: center; user-select: none;
  }
  .panel-handle-bar {
    width: 38px; height: 4px; border-radius: 99px;
    background: rgba(255,255,255,.2); margin: 0 auto 6px;
  }
  .panel-handle-title {
    font-size: 13px; font-weight: 700; opacity: .8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 80%; margin: 0 auto;
  }

  /* Модалки */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--overlay-bg); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel-bg); backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--panel-border); border-radius: 20px; padding: 22px;
    max-width: 460px; width: 100%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    transform: scale(.95) translateY(8px); transition: transform .25s cubic-bezier(.2,.8,.2,1);
    position: relative;
  }
  .modal-overlay.show .modal { transform: scale(1) translateY(0); }
  .modal::-webkit-scrollbar { width: 5px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-header h2 { font-size: 20px; margin: 0; }
  .close-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--btn-border);
    background: var(--btn-bg); cursor: pointer; font-size: 16px; color: var(--text-primary);
    display: flex; align-items: center; justify-content: center; transition: .2s;
  }
  .close-btn:hover { background: var(--btn-hover); }

  /* Карточка страны */
  .country-card { text-align: center; }
  .country-card h2 { font-size: 24px; margin: 8px 0 4px; }
  .country-card .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; text-align: left; }
  .country-card .fact { padding: 8px 10px; border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--btn-border); font-size: 12px; }
  .country-card .fact b { display: block; font-size: 13px; margin-bottom: 2px; }
  .country-card .fun-fact {
    padding: 10px 12px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(139,92,246,.1), rgba(6,182,212,.1));
    border: 1px solid rgba(139,92,246,.15);
    font-size: 13px; line-height: 1.4; margin: 10px 0; text-align: left;
  }

  /* Обучение */
  .learn-card { text-align: center; padding: 10px 0; }
  .learn-card .nav { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }

  /* Сравнение */
  .compare-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .compare-col { text-align: center; padding: 12px; border-radius: 12px; background: var(--btn-bg); border: 1px solid var(--btn-border); }
  .compare-col h3 { font-size: 16px; margin: 6px 0; }
  .compare-col .cap { font-size: 12px; opacity: .7; margin: 3px 0; }

  /* Поиск */
  .search-input {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-primary);
    font-size: 16px; font-family: inherit; outline: none; margin-bottom: 12px;
  }
  .search-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .search-results { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .search-result-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: .15s;
    display: flex; align-items: center; gap: 10px; font-size: 14px;
  }
  .search-result-item:hover { background: var(--btn-hover); }

  /* Ежедневные задания */
  .daily-list { display: flex; flex-direction: column; gap: 8px; }
  .daily-item {
    padding: 12px; border-radius: 12px; background: var(--btn-bg);
    border: 1px solid var(--btn-border); display: flex; align-items: center; gap: 10px;
  }
  .daily-item.done { opacity: .5; }
  .daily-item.done .daily-name { text-decoration: line-through; }
  .daily-icon { font-size: 24px; }
  .daily-info { flex: 1; }
  .daily-name { font-size: 14px; font-weight: 700; }
  .daily-desc { font-size: 12px; opacity: .6; }
  .daily-reward { font-size: 12px; font-weight: 700; color: var(--accent-1); }

  /* Ачивки */
  .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .ach-card {
    padding: 12px 8px; border-radius: 12px; text-align: center;
    background: var(--btn-bg); border: 1px solid var(--btn-border); transition: .2s; position: relative;
  }
  .ach-card.unlocked {
    background: linear-gradient(135deg, rgba(139,92,246,.12), rgba(6,182,212,.12));
    border-color: rgba(139,92,246,.25); box-shadow: 0 3px 10px rgba(139,92,246,.15);
  }
  .ach-card.locked { opacity: .45; filter: grayscale(.6); }
  .ach-icon { font-size: 28px; margin-bottom: 4px; }
  .ach-name { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .ach-desc { font-size: 10px; opacity: .65; line-height: 1.3; }
  .ach-lock { position: absolute; top: 4px; right: 4px; font-size: 10px; opacity: .5; }

  /* Статистика */
  .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .stat-box { padding: 10px 6px; border-radius: 10px; text-align: center; background: var(--btn-bg); border: 1px solid var(--btn-border); }
  .stat-value {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat-label { font-size: 10px; opacity: .55; margin-top: 2px; }
  .donut-wrap { display: flex; justify-content: center; margin: 12px 0; }
  .weak-list { display: flex; flex-direction: column; gap: 5px; max-height: 250px; overflow-y: auto; }
  .weak-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--btn-border);
  }
  .weak-flag { font-size: 20px; }
  .weak-info { flex: 1; min-width: 0; }
  .weak-name { font-size: 13px; font-weight: 700; }
  .weak-bar { height: 3px; border-radius: 99px; background: var(--btn-border); margin-top: 3px; overflow: hidden; }
  .weak-fill { height: 100%; background: linear-gradient(90deg, #f43f5e, #fb923c); border-radius: 99px; }
  .weak-pct { font-size: 11px; font-weight: 700; opacity: .65; min-width: 36px; text-align: right; }
  .continent-progress { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .continent-progress-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .continent-progress-bar { flex: 1; height: 6px; border-radius: 99px; background: var(--btn-bg); overflow: hidden; }
  .continent-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width .5s; }
  .continent-progress-pct { font-size: 11px; font-weight: 700; opacity: .6; min-width: 32px; text-align: right; }
  .empty-state { text-align: center; padding: 24px 10px; opacity: .5; }
  .empty-state .big-emoji { font-size: 40px; margin-bottom: 8px; }

  /* Скелетон */
  .skeleton { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
  .skeleton-block { height: 20px; border-radius: 8px; background: var(--skeleton-bg); animation: skeletonPulse 1.5s ease infinite; }
  .skeleton-block.w60 { width: 60%; }
  .skeleton-block.w80 { width: 80%; }
  .skeleton-block.w40 { width: 40%; }

  .onboarding p { font-size: 15px; opacity: .7; margin-bottom: 16px; }
  .onboarding .onboarding-icon { font-size: 64px; margin-bottom: 12px; }
  .onboarding-dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0; }
  .onboarding-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--btn-border); transition: .2s; }
  .onboarding-dot.active { background: var(--accent-1); width: 20px; }

  /* Тосты */
  .toast-container {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; width: 90%; max-width: 340px;
  }
  .toast {
    background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(6,182,212,.95));
    color: #fff; padding: 12px 16px; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(139,92,246,.4);
    display: flex; align-items: center; gap: 10px;
    animation: toastIn .35s cubic-bezier(.2,.8,.2,1) both;
    pointer-events: auto;
  }
  .toast.out { animation: toastOut .25s ease both; }
  .toast-icon { font-size: 24px; }
  .toast-text { flex: 1; }
  .toast-title { font-size: 13px; font-weight: 800; }
  .toast-desc { font-size: 11px; opacity: .85; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-16px) scale(.9); } }

  @media (max-width: 700px) {
    .hud { top: 8px; left: 8px; gap: 6px; }
    .logo { font-size: 14px; padding: 6px 10px; }

    .panel-handle { display: block; }
    .panel-content { opacity: 0; pointer-events: none; transition: opacity .2s .1s; }

    .stat-value { font-size: 16px; }
    .compare-cols { grid-template-columns: 1fr; }
  }

function getDefaultStats() {

  };
}

function saveStats() { saveToStorage(STORAGE_KEYS.stats, stats); }
function saveAchievements() { saveToStorage(STORAGE_KEYS.achievements, [...unlockedAchievements]); }

function trackCorrectAnswer(countryKey) {
  stats.countryCorrect[countryKey] = (stats.countryCorrect[countryKey] || 0) + 1;
  saveStats();
}

function trackWrongAnswer(countryKey) {
  stats.countryErrors[countryKey] = (stats.countryErrors[countryKey] || 0) + 1;
  saveStats();
}

function trackCountryExplored(countryKey) {
  if (!stats.exploredCountries.includes(countryKey)) {
    stats.exploredCountries.push(countryKey);
    saveStats();
    checkAchievements();
  }
}

function trackGameEnd(score, total, level, isBlitz) {
  stats.gamesPlayed++;
  if (score === total) {
    stats.perfectGames++;
    if (isBlitz) stats.blitzPerfect++;
    if (level !== 'world') {
      stats.continentsPerfected = stats.continentsPerfected || {};
      stats.continentsPerfected[level] = true;
    }
  }
  saveStats();
  checkAchievements();
}

function getWeakCountries(limit = 8) {
  const items = [];
  for (const key of Object.keys(stats.countryErrors)) {
    const errors = stats.countryErrors[key];
    const correct = stats.countryCorrect[key] || 0;
    const total = errors + correct;
    if (total > 0 && errors > 0) {
      items.push({ key, errors, correct, total, percent: errors / total });
    }
  }
  items.sort((a, b) => b.percent - a.percent || b.errors - a.errors);
  return items.slice(0, limit);
}

let audioContext = null;
let soundEnabled = loadFromStorage(STORAGE_KEYS.sound, true);

function initAudio() {
  if (!audioContext) {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  }
  if (audioContext && audioContext.state === 'suspended') {
    audioContext.resume();
  }
}

function playTone(frequency, duration, type = 'sine', volume = 0.08, delay = 0) {
  if (!soundEnabled || !audioContext) return;
  const startTime = audioContext.currentTime + delay;
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.015);
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);
  oscillator.start(startTime);
  oscillator.stop(startTime + duration + 0.05);
}

function playCorrectSound() {
  playTone(523, 0.1, 'sine', 0.06, 0);
  playTone(659, 0.1, 'sine', 0.06, 0.07);
  playTone(784, 0.15, 'sine', 0.08, 0.14);
}

function updateOceanColors() {
  const style = getComputedStyle(document.documentElement);
  const ocean1 = style.getPropertyValue('--ocean-1').trim();
  const ocean2 = style.getPropertyValue('--ocean-2').trim();
  document.querySelector('.ocean-stop-1').setAttribute('stop-color', ocean1);
  document.querySelector('.ocean-stop-2').setAttribute('stop-color', ocean2);
}

function updateLandColors() {
  if (!countryPaths) return;
  const style = getComputedStyle(document.documentElement);
  const known = style.getPropertyValue('--land-known').trim();
  const unknown = style.getPropertyValue('--land-unknown').trim();
  const border = style.getPropertyValue('--land-border').trim();
  const highlight = style.getPropertyValue('--land-highlight').trim();
  const highlightStroke = style.getPropertyValue('--land-highlight-stroke').trim();
  
  countryPaths.each(function(d) {
    const element = d3.select(this);
    if (d.__highlighted) {
      element.attr('fill', highlight)
        .attr('stroke', highlightStroke)
        .attr('stroke-width', 2)
        .attr('filter', 'url(#glow)');
    } else {
      element.attr('fill', COUNTRIES_DB[getFeatureKey(d)] ? known : unknown)
        .attr('stroke', border)
        .attr('stroke-width', 0.6)
        .attr('filter', null);
    }
  });
}

function getCurrentMasteryLevel() {
  const games = stats.gamesPlayed;
  for (let i = MASTERY_LEVELS.length - 1; i >= 0; i--) {
    if (games >= MASTERY_LEVELS[i].minGames) {
      return { ...MASTERY_LEVELS[i], index: i };
    }
  }
  return MASTERY_LEVELS[0];
}

function updateMasteryLevelUI() {
  const level = getCurrentMasteryLevel();
  const nextLevel = MASTERY_LEVELS[level.index + 1];
  document.getElementById('level-icon').textContent = level.icon;
  document.getElementById('level-name').textContent = level.name;
  const percent = nextLevel
    ? Math.min(100, (stats.gamesPlayed - level.minGames) / (nextLevel.minGames - level.minGames) * 100)
    : 100;
  document.getElementById('level-fill').style.width = percent + '%';
}

function checkAchievements() {
  const newlyUnlocked = [];
  for (const achievement of ACHIEVEMENTS) {
    if (!unlockedAchievements.has(achievement.id) && achievement.check(stats, unlockedAchievements)) {
      unlockedAchievements.add(achievement.id);
      newlyUnlocked.push(achievement);
    }
  }
  if (newlyUnlocked.length > 0) {
    saveAchievements();
    newlyUnlocked.forEach((achievement, index) => {
      setTimeout(() => {
        playAchievementSound();
        showToast(achievement.icon, `Ачивка: ${achievement.name}`, achievement.desc);
      }, index * 700);
    });
  }
}

function getDailyTasks() {
  const today = new Date().toDateString();
  const saved = loadFromStorage(STORAGE_KEYS.daily, {});
  if (saved.date === today) return saved;
  
  const tasks = [
    { icon: '🎯', name: 'Точный стрелок', desc: 'Ответь правильно 7 раз', target: 7, type: 'correct' },
    { icon: '🌍', name: 'Исследователь', desc: 'Изучи 5 новых стран', target: 5, type: 'explore' },
    { icon: '⚡', name: 'Быстрый ум', desc: 'Сыграй 2 блиц-игры', target: 2, type: 'blitz' }
  ];
  
  const result = { date: today, tasks: tasks.map(t => ({ ...t, progress: 0, done: false })) };
  saveToStorage(STORAGE_KEYS.daily, result);
  return result;
}

function updateDailyTask(type, value = 1) {
  const daily = getDailyTasks();
  daily.tasks.forEach(task => {
    if (task.type === type && !task.done) {
      task.progress = Math.min(task.target, task.progress + value);
      if (task.progress >= task.target) {
        task.done = true;
        showToast('✅', 'Задание выполнено!', task.name);
      }
    }
  });
  saveToStorage(STORAGE_KEYS.daily, daily);
}

function renderDailyTasks() {
  const daily = getDailyTasks();
  document.getElementById('daily-content').innerHTML = `
    <div class="daily-list">
      ${daily.tasks.map(task => `
        <div class="daily-item ${task.done ? 'done' : ''}">
          <div class="daily-icon">${task.icon}</div>
          <div class="daily-info">
            <div class="daily-name">${task.name}</div>
            <div class="daily-desc">${task.desc}</div>
          </div>
          <div class="daily-reward">${task.progress}/${task.target}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ============ ЭКСПОРТ РЕЗУЛЬТАТА ============
function exportResult(score, total) {
  const canvas = document.createElement('canvas');
  canvas.width = 600;
  canvas.height = 400;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 600, 400);
  
  const gradient = ctx.createLinearGradient(0, 0, 600, 0);
  gradient.addColorStop(0, '#8b5cf6');
  gradient.addColorStop(1, '#06b6d4');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 600, 6);
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🌍 ГеоМастер', 300, 60);
  
  ctx.font = 'bold 72px Manrope, sans-serif';
  ctx.fillText(`${score}/${total}`, 300, 170);
  
  const percent = score / total;
  const message = percent === 1 ? 'Идеально!' : percent >= .8 ? 'Отлично!' : percent >= .5 ? 'Неплохо!' : 'Попробуй ещё!';
  ctx.font = '24px Manrope, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(message, 300, 220);
  
  const masteryLevel = getCurrentMasteryLevel();
  ctx.font = '18px Manrope, sans-serif';
  ctx.fillText(`${masteryLevel.icon} ${masteryLevel.name}`, 300, 270);
  
  ctx.font = '14px Manrope, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('geomaster.game', 300, 370);
  
  const link = document.createElement('a');
  link.download = 'geomaster-result.png';
  link.href = canvas.toDataURL();
  link.click();
  
  showToast('📤', 'Результат сохранён', 'Картинка скачана!');
}

    .filter(([key]) => key !== 'world')

// ============ ЧАСТИЦЫ ============
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let width, height;
  
  function resize() {
    width = canvas.width = innerWidth;
    height = canvas.height = innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  const particles = Array.from({ length: 50 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    radius: Math.random() * 1.5 + 0.5,
    dx: (Math.random() - 0.5) * 0.15,
    dy: (Math.random() - 0.5) * 0.1,
    opacity: Math.random() * 0.3 + 0.1
  }));
  
  function draw() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0) p.x = width;
      if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height;
      if (p.y > height) p.y = 0;
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(139,92,246,${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

function getFeatureKey(feature) {
  const id = String(feature.id ?? '');
  if (!id) return null;
  if (id.startsWith('-')) return NAME_TO_KEY[feature.properties?.name] || null;
  return id.padStart(3, '0');
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============ SWIPE ДЛЯ ПАНЕЛИ ============
let touchStartY = 0, touchCurrentY = 0, isSwiping = false;

panelHandle.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchCurrentY = touchStartY;
  isSwiping = false;
}, { passive: true });

panelHandle.addEventListener('touchmove', (e) => {
  touchCurrentY = e.touches[0].clientY;
  const dy = touchCurrentY - touchStartY;
  if (dy > 10) {
    isSwiping = true;
    panel.style.transform = `translateY(${dy}px)`;
  }
}, { passive: true });

panelHandle.addEventListener('touchend', () => {
  if (isSwiping && touchCurrentY - touchStartY > 60) {
    panel.classList.remove('expanded');
  }
  panel.style.transform = '';
  touchStartY = 0;
  touchCurrentY = 0;
  isSwiping = false;
});

// ============ ИНИЦИАЛИЗАЦИЯ ============
init();

async function init() {
  applyTheme(loadTheme());
  document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
  initParticles();
  updateMasteryLevelUI();
  
  let worldData;
  try {
    worldData = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  } catch (e) {
    panelContent.innerHTML = '<h2>😢 Ошибка загрузки</h2><p>Проверь интернет и обнови страницу.</p>';
    return;
  }
  
  const countries = topojson.feature(worldData, worldData.objects.countries);
  countries.features.forEach(feature => {
    const key = getFeatureKey(feature);
    if (key) featureByKey[key] = feature;
  });
  
  svg = d3.select('#map');
  viewport = d3.select('#viewport');
  projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [MAP_WIDTH - 10, MAP_HEIGHT - 10]], { type: 'Sphere' });
  pathGenerator = d3.geoPath(projection);
  
  haloPath = viewport.append('path')
    .attr('fill', 'none')
    .attr('stroke', 'rgba(96,165,250,.4)')
    .attr('stroke-width', 8)
    .attr('filter', 'url(#glow)')
    .style('display', 'none');
  
  spherePath = viewport.append('path')
    .attr('fill', 'url(#oceanGrad)')
    .attr('stroke', 'rgba(255,255,255,.1)')
    .attr('stroke-width', 1);
  
  graticulePath = viewport.append('path')
    .attr('fill', 'none')
    .attr('stroke', 'rgba(255,255,255,.04)')
    .attr('stroke-width', 0.5);
  
  countryPaths = viewport.append('g').attr('id', 'countries')
    .selectAll('path')
    .data(countries.features)
    .join('path')
    .attr('d', pathGenerator)
    .on('click', (event, feature) => {
      initAudio();
      if (currentMode === 'explore') {
        highlightAndShow(feature);
      } else if (currentMode === 'quiz') {
        answerCountry(feature);
      }
    })
    .on('mousemove', moveTooltip)
    .on('mouseleave', () => tooltip.style.display = 'none');
  
  updateLandColors();
  redrawAll();
  
  zoom = d3.zoom()
    .scaleExtent([1, 25])
    .translateExtent([[0, 0], [MAP_WIDTH, MAP_HEIGHT]])
    .on('zoom', event => viewport.attr('transform', event.transform));
  svg.call(zoom);
  
  globeDrag = d3.drag()
    .clickDistance(5)
    .on('start', () => svg.interrupt())
    .on('drag', (event) => {
      const k = 57.2958 / projection.scale();
      const rotation = projection.rotate();
      const phi = Math.max(-85, Math.min(85, rotation[1] - event.dy * k));
      projection.rotate([rotation[0] + event.dx * k, phi, 0]);
      redrawAll();
    });
  
  // Pinch-to-zoom
  let touchStartDistance = 0, touchStartScale = 0;
  
  svg.on('touchstart.pinch', function(event) {
    if (event.touches.length === 2) {
      event.preventDefault();
      touchStartDistance = getTouchDistance(event.touches[0], event.touches[1]);
      touchStartScale = mapMode === 'globe' ? projection.scale() : d3.zoomTransform(svg.node()).k;
    }
  });
  
  svg.on('touchmove.pinch', function(event) {
    if (event.touches.length === 2) {
      event.preventDefault();
      const distance = getTouchDistance(event.touches[0], event.touches[1]);
      const scale = touchStartScale * (distance / touchStartDistance);
      if (mapMode === 'globe') {
        projection.scale(Math.max(globeScaleDefault * 0.7, Math.min(globeScaleDefault * 5, scale)));
        redrawAll();
      } else {
        svg.call(zoom.transform, d3.zoomIdentity.scale(Math.max(1, Math.min(25, scale))));
      }
    }
  });
  
  function getTouchDistance(touch1, touch2) {
    return Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
  }
  
  isReady = true;
  setMode('explore');
  setTimeout(showOnboarding, 800);
}

function highlightAndShow(feature) {
  const key = getFeatureKey(feature);
  if (highlightedFeature) {
    highlightedFeature.__highlighted = false;
  }
  feature.__highlighted = true;
  highlightedFeature = feature;
  updateLandColors();
  playClickSound();
  vibrate(20);
  
  setTimeout(() => {
    showCountryCard(key);
    zoomTo(feature);
  }, 350);
}

function redrawAll() {
  spherePath.attr('d', pathGenerator({ type: 'Sphere' }));
  graticulePath.attr('d', pathGenerator(d3.geoGraticule10()));
  haloPath.attr('d', pathGenerator({ type: 'Sphere' }));
  countryPaths.attr('d', pathGenerator);
}

function setMapMode(mode) {
  if (!isReady || mapMode === mode) return;
  mapMode = mode;
  document.getElementById('view-flat').classList.toggle('active', mode === 'flat');
  document.getElementById('view-globe').classList.toggle('active', mode === 'globe');
  tooltip.style.display = 'none';
  svg.interrupt();
  playClickSound();
  
  if (mode === 'globe') {
    stats.globeSwitches = (stats.globeSwitches || 0) + 1;
    saveStats();
    checkAchievements();
  }
  
  if (mode === 'flat') {
    svg.on('.drag', null);
    projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [MAP_WIDTH - 10, MAP_HEIGHT - 10]], { type: 'Sphere' });
    haloPath.style('display', 'none');
    svg.call(zoom);
    svg.call(zoom.transform, d3.zoomIdentity);
  } else {
    svg.on('.zoom', null);
    viewport.attr('transform', null);
    projection = d3.geoOrthographic().clipAngle(90)
      .fitExtent([[30, 30], [MAP_WIDTH - 30, MAP_HEIGHT - 30]], { type: 'Sphere' });
    globeScaleDefault = projection.scale();
    projection.rotate(GLOBE_INITIAL_ROTATION);
    haloPath.style('display', null);
    svg.call(globeDrag);
  }
  pathGenerator = d3.geoPath(projection);
  redrawAll();
  updateLandColors();
  if (currentMode === 'explore') showExplorePrompt();
}

function moveTooltip(event, feature) {
  if (currentMode !== 'explore') {
    tooltip.style.display = 'none';
    return;
  }
  const country = COUNTRIES_DB[getFeatureKey(feature)];
  tooltip.textContent = country ? country.name : (feature.properties?.name) || '';
  tooltip.style.display = 'block';
  tooltip.style.left = (event.clientX + 12) + 'px';
  tooltip.style.top = (event.clientY + 14) + 'px';
}

function zoomTo(feature) {
  if (mapMode === 'globe') {
    rotateTo(feature);
    return;
  }
  const [[x0, y0], [x1, y1]] = pathGenerator.bounds(feature);
  const scale = Math.max(1, Math.min(12, 0.65 / Math.max((x1 - x0) / MAP_WIDTH, (y1 - y0) / MAP_HEIGHT)));
  const translateX = MAP_WIDTH / 2 - scale * (x0 + x1) / 2;
  const translateY = MAP_HEIGHT / 2 - scale * (y0 + y1) / 2;
  svg.transition().duration(700)
    .call(zoom.transform, d3.zoomIdentity.translate(translateX, translateY).scale(scale));
}

function rotateTo(feature) {
  const [longitude, latitude] = d3.geoCentroid(feature);
  const currentRotation = projection.rotate();
  let targetLongitude = -longitude;
  while (targetLongitude - currentRotation[0] > 180) targetLongitude -= 360;
  while (targetLongitude - currentRotation[0] < -180) targetLongitude += 360;
  const targetRotation = [targetLongitude, Math.max(-85, Math.min(85, -latitude)), 0];
  const interpolator = d3.interpolate(currentRotation, targetRotation);
  svg.transition('rotate').duration(700).ease(d3.easeCubicInOut)
    .tween('rotate', () => t => {
      projection.rotate(interpolator(t));
      redrawAll();
    });
}

function resetZoom() {
  if (!isReady) return;
  playClickSound();
  if (highlightedFeature) {
    highlightedFeature.__highlighted = false;
    highlightedFeature = null;
    updateLandColors();
  }
  if (mapMode === 'flat') {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  } else {
    const currentRotation = projection.rotate();
    let targetLongitude = GLOBE_INITIAL_ROTATION[0];
    while (targetLongitude - currentRotation[0] > 180) targetLongitude -= 360;
    while (targetLongitude - currentRotation[0] < -180) targetLongitude += 360;
    const rotationInterpolator = d3.interpolate(currentRotation, [targetLongitude, GLOBE_INITIAL_ROTATION[1], 0]);
    const scaleInterpolator = d3.interpolate(projection.scale(), globeScaleDefault);
    svg.transition('reset').duration(500)
      .tween('reset', () => t => {
        projection.rotate(rotationInterpolator(t));
        projection.scale(scaleInterpolator(t));
        redrawAll();
      });
  }
}

function zoomBy(factor) {
  if (!isReady) return;
  playClickSound();
  if (mapMode === 'flat') {
    svg.transition().duration(250).call(zoom.scaleBy, factor);
  } else {
    const currentScale = projection.scale();
    const targetScale = Math.max(globeScaleDefault * 0.7, Math.min(globeScaleDefault * 5, currentScale * factor));
    svg.transition('zoomGlobe').duration(200).tween('scale', () => {
      const interpolator = d3.interpolate(currentScale, targetScale);
      return t => {
        projection.scale(interpolator(t));
        redrawAll();
      };
    });
  }
}

function clearFlash() {
  if (countryPaths) {
    countryPaths.classed('flash-correct', false).classed('flash-wrong', false);
  }
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

function setMode(mode) {
  if (!isReady) return;
  clearTimeout(advanceTimer);
  stopTimer();
  currentMode = mode;
  if (mode !== 'quiz') {
    currentQuiz = null;
    clearFlash();
  }
  if (mode === 'explore') resetZoom();
  tooltip.style.display = 'none';
  document.getElementById('btn-explore').classList.toggle('active', mode === 'explore');
  document.getElementById('btn-quiz').classList.toggle('active', mode === 'setup' || mode === 'quiz');
  document.getElementById('btn-learn').classList.toggle('active', mode === 'learn');
  if (mode === 'explore') showExplorePrompt();
  if (mode === 'setup') renderSetup();
  if (mode === 'learn') renderLearn();
  collapsePanel();
  playClickSound();
}

function showExplorePrompt() {
  const countryCount = Object.keys(COUNTRIES_DB).filter(k => featureByKey[k]).length;
  const hint = mapMode === 'globe'
    ? '🌐 Вращай глобус · щипок — масштаб'
    : '🖱️ Колёсико — масштаб · перетаскивание';
  panelContent.innerHTML = `
    <div class="fade">
      <h2>🧭 Исследование</h2>
      <p>Кликай по странам, чтобы узнать факты.</p>
      <p class="dim">${hint}</p>
      <p class="dim">В базе <b>${countryCount}</b> стран.</p>
      <div class="btn-row">
        <button class="btn primary" onclick="setMode('setup')">🎯 Викторина</button>
        <button class="btn small" onclick="renderDailyTasks();openModal('daily')">📋 Задания</button>
        <button class="btn small" onclick="renderAchievements();openModal('achievements')">🏆 Ачивки</button>
        <button class="btn small" onclick="renderStats();openModal('stats')">📊 Стат</button>
      </div>
    </div>
  `;
  setPanelHandleTitle('🧭 Карта');
}

// ============ РЕЖИМ ОБУЧЕНИЯ ============
let learnIndex = 0, learnKeys = [];

function renderLearn() {
  learnKeys = shuffle(Object.keys(COUNTRIES_DB).filter(k => featureByKey[k]));
  learnIndex = 0;
  renderLearnCard();
}

function renderLearnCard() {
  if (learnIndex >= learnKeys.length) learnIndex = 0;
  const key = learnKeys[learnIndex];
  const country = COUNTRIES_DB[key];
  const facts = COUNTRY_FACTS[key];
  
  const factsHtml = facts 
    ? `<div class="facts">
        <div class="fact"><b>💰 Валюта</b>${facts[0]}</div>
        <div class="fact"><b>🗣️ Язык</b>${facts[1]}</div>
        <div class="fact"><b>👥 Население</b>${facts[2]}</div>
        <div class="fact"><b>📐 Площадь</b>${facts[3]}</div>
      </div>
      <div class="fun-fact">💡 ${facts[4]}</div>`
    : `<p class="dim">Столица: ${country.capital}</p>`;
  
  panelContent.innerHTML = `
    <div class="learn-card fade">
      <h2 style="font-size:18px">📖 Изучение</h2>
      <p class="dim">${learnIndex + 1} / ${learnKeys.length}</p>
      ${getFlagImage(country.flag)}
      <h2 style="font-size:22px">${country.name}</h2>
      <p class="en-name">${LEVELS[country.level].icon} ${LEVELS[country.level].name} · 🏛️ ${country.capital}</p>
      ${factsHtml}
      <div class="nav">
        <button class="btn small" onclick="learnIndex=Math.max(0,learnIndex-1);renderLearnCard()">←</button>
        <button class="btn primary small" onclick="learnIndex++;renderLearnCard()">Далее →</button>
      </div>
    </div>
  `;
  setPanelHandleTitle(`📖 ${country.name}`);
  trackCountryExplored(key);
  updateDailyTask('explore');
  const feature = featureByKey[key];
  if (feature) zoomTo(feature);
}

// ============ НАСТРОЙКА ВИКТОРИНЫ ============
function renderSetup() {
  const chips = Object.entries(LEVELS).map(([key, level]) => 
    `<button class="chip ${selectedLevel === key ? 'active' : ''}" onclick="selectedLevel='${key}';playClickSound();renderSetup()">
      ${level.icon} ${level.name}
      <span class="chip-count">${getCountryPoolForLevel(key).length}</span>
    </button>`
  ).join('');
  
  const recordKey = selectedLevel + (selectedBlitz ? '-blitz' : '-classic');
  const record = loadRecords()[recordKey];
  
  panelContent.innerHTML = `
    <div class="fade">
      <h2>🎯 Викторина</h2>
      <div class="section-label">Уровень</div>
      <div class="chips">${chips}</div>
      <div class="section-label">Режим</div>
      <div class="chips">
        <button class="chip ${!selectedBlitz ? 'active' : ''}" onclick="selectedBlitz=false;playClickSound();renderSetup()">♾️ Классика</button>
        <button class="chip ${selectedBlitz ? 'active' : ''}" onclick="selectedBlitz=true;playClickSound();renderSetup()">⚡ Блиц · ${QUESTION_TIME}с</button>
      </div>
      <div class="record-line">
        ${record ? `🏆 Рекорд: <b>${record.score}/10</b> · ${record.date}` : '🏆 Установи рекорд!'}
      </div>
      <button class="btn primary big" onclick="startQuiz()">▶ Начать</button>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn small" onclick="renderAchievements();openModal('achievements')" style="flex:1">🏆 ${unlockedAchievements.size}/${ACHIEVEMENTS.length}</button>
        <button class="btn small" onclick="renderStats();openModal('stats')" style="flex:1">📊 Стат</button>
      </div>
    </div>
  `;
  setPanelHandleTitle('🎯 Викторина');
  if (isMobile()) panel.classList.add('expanded');
}

function startQuiz() {
  if (!isReady) return;
  initAudio();
  clearTimeout(advanceTimer);
  stopTimer();
  clearFlash();
  resetZoom();
  currentMode = 'quiz';
  
  const pool = shuffle(getCountryPoolForLevel(selectedLevel)).slice(0, 10);
  currentQuiz = {
    level: selectedLevel,
    blitz: selectedBlitz,
    questions: pool.map(key => ({ id: key, type: getRandomQuestionType() })),
    current: 0,
    score: 0,
    answered: false,
    streak: 0,
    hintsUsed: 0
  };
  
  document.getElementById('btn-explore').classList.remove('active');
  document.getElementById('btn-quiz').classList.add('active');
  renderQuizQuestion();
  collapsePanel();
  playClickSound();
}

function renderQuizQuestion() {
  currentQuiz.answered = false;
  const question = currentQuiz.questions[currentQuiz.current];
  const country = COUNTRIES_DB[question.id];
  const level = LEVELS[currentQuiz.level];
  
  let title, target;
  if (question.type === 'name') {
    title = 'Найди страну';
    target = `<div class="q-target">${country.name}</div>`;
  } else if (question.type === 'flag') {
    title = 'Найди по флагу';
    target = getFlagImage(country.flag);
  } else {
    title = 'Найди по столице';
    target = `<div class="q-target">${country.capital}</div>`;
  }
  
  const streakHtml = currentQuiz.streak >= 2 
    ? `<span class="pill streak-pill">🔥 ${currentQuiz.streak}</span>` 
    : '';
  
  panelContent.innerHTML = `
    <div class="fade">
      <div class="quiz-top">
        <span class="pill">${level.icon} ${level.name}</span>
        <span class="pill">${currentQuiz.blitz ? '⚡ Блиц' : '♾️'}</span>
        <span class="pill">${currentQuiz.current + 1}/${currentQuiz.questions.length}</span>
        <span class="pill score-pill">⭐ ${currentQuiz.score}</span>
        ${streakHtml}
      </div>
      ${currentQuiz.blitz ? `
        <div class="timer">
          <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>
          <span id="timer-num">${QUESTION_TIME}</span>
        </div>
      ` : ''}
      <h2 class="q-title">${title}</h2>
      ${target}
      <div id="hint-area"></div>
      <div id="q-feedback"></div>
      <div class="btn-row">
        ${currentQuiz.blitz ? '' : `<button id="next-question" class="btn primary hidden" onclick="nextQuestion()">Далее →</button>`}
        <button class="btn small" onclick="useHint()">💡 Подсказка</button>
        <button class="btn small ghost" onclick="setMode('setup')">Выйти</button>
      </div>
    </div>
  `;
  
  setPanelHandleTitle(`${title}: ${question.type === 'flag' ? '🚩' : (question.type === 'name' ? country.name : country.capital)}`);
  if (currentQuiz.blitz) startTimer();
}

function useHint() {
  if (!currentQuiz || currentQuiz.answered || currentQuiz.hintsUsed >= 2) return;
  currentQuiz.hintsUsed++;
  const question = currentQuiz.questions[currentQuiz.current];
  const country = COUNTRIES_DB[question.id];
  const level = LEVELS[country.level];
  const hint = `${level.icon} Континент: <b>${level.name}</b> · Начинается на «<b>${country.name[0]}</b>»`;
  document.getElementById('hint-area').innerHTML = `<div class="hint-box">💡 ${hint}</div>`;
  showToast('💡', 'Подсказка', '−1 очко за подсказку', 2000);
  playClickSound();
}

function startTimer() {
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimerUI();
  timerId = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      stopTimer();
      onTimeout();
    }
    updateTimerUI();
  }, 100);
}

function updateTimerUI() {
  const bar = document.getElementById('timer-bar');
  const num = document.getElementById('timer-num');
  if (bar) {
    bar.style.width = Math.max(0, timeLeft / QUESTION_TIME * 100) + '%';
    bar.classList.toggle('low', timeLeft <= 5);
  }
  if (num) num.textContent = Math.max(0, Math.ceil(timeLeft));
}

function onTimeout() {
  if (currentQuiz && !currentQuiz.answered) answerCountry(null);
}

function answerCountry(feature) {
  if (currentMode !== 'quiz' || !currentQuiz || currentQuiz.answered) return;
  currentQuiz.answered = true;
  stopTimer();
  
  const question = currentQuiz.questions[currentQuiz.current];
  const clickedKey = feature ? getFeatureKey(feature) : null;
  const isCorrect = clickedKey === question.id;
  
  if (isCorrect) {
    currentQuiz.score++;
    currentQuiz.streak++;
    stats.currentStreak = currentQuiz.streak;
    if (currentQuiz.streak > stats.maxStreak) {
      stats.maxStreak = currentQuiz.streak;
      saveStats();
    }
    trackCorrectAnswer(question.id);
    playCorrectSound();
    vibrate(20);
    if (currentQuiz.streak >= 3 && currentQuiz.streak % 3 === 0) playStreakSound();
    updateDailyTask('correct');
  } else {
    currentQuiz.streak = 0;
    trackWrongAnswer(question.id);
    if (clickedKey && clickedKey !== question.id) trackWrongAnswer(clickedKey);
    playWrongSound();
    vibrate(80);
  }
  
  if (currentQuiz.hintsUsed > 0 && isCorrect) {
    currentQuiz.score = Math.max(0, currentQuiz.score - currentQuiz.hintsUsed);
  }
  
  if (feature) {
    countryPaths.filter(p => p === feature).classed(isCorrect ? 'flash-correct' : 'flash-wrong', true);
  }
  const correctFeature = featureByKey[question.id];
  if (!isCorrect && correctFeature) {
    countryPaths.filter(p => p === correctFeature).classed('flash-correct', true);
  }
  
  showQuizFeedback(isCorrect, question, !feature);
  if (correctFeature) zoomTo(correctFeature);
  
  if (currentQuiz.blitz) {
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(nextQuestion, 1400);
  }
}

function showQuizFeedback(isCorrect, question, isTimeout) {
  const country = COUNTRIES_DB[question.id];
  const feedback = document.getElementById('q-feedback');
  if (isCorrect) {
    feedback.className = 'good';
    feedback.textContent = `✅ Верно! Это ${country.name}.`;
  } else if (isTimeout) {
    feedback.className = 'bad';
    feedback.textContent = `⏰ Время вышло! Это ${country.name}.`;
  } else {
    feedback.className = 'bad';
    feedback.textContent = `❌ Мимо. Это ${country.name}.`;
  }
  const nextButton = document.getElementById('next-question');
  if (nextButton) nextButton.classList.remove('hidden');
}

function nextQuestion() {
  clearTimeout(advanceTimer);
  stopTimer();
  clearFlash();
  currentQuiz.current++;
  if (currentQuiz.current >= currentQuiz.questions.length) {
    showResults();
  } else {
    resetZoom();
    renderQuizQuestion();
  }
}

function showResults() {
  stopTimer();
  const total = currentQuiz.questions.length;
  const records = loadRecords();
  const key = getRecordKey();
  const previousRecord = records[key];
  const isNewRecord = !previousRecord || currentQuiz.score > previousRecord.score;
  
  if (isNewRecord) {
    records[key] = { score: currentQuiz.score, date: new Date().toLocaleDateString('ru-RU') };
    saveRecords(records);
  }
  
  trackGameEnd(currentQuiz.score, total, currentQuiz.level, currentQuiz.blitz);
  updateDailyTask('blitz', currentQuiz.blitz ? 1 : 0);
  updateMasteryLevelUI();
  
  const percent = currentQuiz.score / total;
  const message = percent === 1 ? 'Идеально! 🎉' 
    : percent >= .8 ? 'Отлично! 🔥' 
    : percent >= .5 ? 'Неплохо! 👍' 
    : 'Попробуй ещё! 💪';
  
  panelContent.innerHTML = `
    <div class="fade center">
      <h2>🏁 Готово!</h2>
      <div class="big-score">${currentQuiz.score}<span class="big-total">/${total}</span></div>
      ${isNewRecord ? '<div class="new-record">🏆 Новый рекорд!</div>' : (previousRecord ? `<div class="dim">Рекорд: ${previousRecord.score}/${total}</div>` : '')}
      <p>${message}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" onclick="startQuiz()">🔄 Ещё</button>
        <button class="btn small" onclick="exportResult(${currentQuiz.score},${total})">📤 Поделиться</button>
        <button class="btn small" onclick="setMode('setup')">⚙️</button>
        <button class="btn small ghost" onclick="setMode('explore')">🧭</button>
      </div>
    </div>
  `;
  setPanelHandleTitle(`🏁 ${currentQuiz.score}/${total}`);
  resetZoom();
  if (isMobile()) panel.classList.add('expanded');
  if (isNewRecord) setTimeout(playRecordSound, 300);
}
</script>
</body>
</html>
